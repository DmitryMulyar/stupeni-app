<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Ступени">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#F3F6F5" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#141B1E" media="(prefers-color-scheme: dark)">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}body{-webkit-touch-callout:none;overscroll-behavior-y:none}</style>
</head>
<body>
<title>Ступени</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@500;700&family=Nunito:wght@400;600;700;800&display=swap">
<style>
/* Layout: спокойная «лестница» из мягких цветных блоков; одна колонка на телефоне,
   две на планшете; детский режим без навигации, только крупные карточки. */
:root{
  --bg:#F3F6F5; --surface:#FFFFFF; --surface-2:#E9EFED; --line:#D9E3E0;
  --ink:#2C3A3F; --ink-2:#5E6E72; --accent:#3D7A62; --accent-ink:#FFFFFF;
  --sage:#D3E7DB; --sky:#D6E5F3; --peach:#F8E0D1; --lavender:#E3DEF4; --butter:#F6EDC7; --rose:#F4D6D6;
  --i-rose:#E7A2A2; --i-green:#94C4A3; --i-brown:#A88A70; --i-lime:#CADB8C; --i-yellow:#F0D27C;
  --i-sky:#9EC3E5; --i-peach:#F1B996; --i-lavender:#BBB1E4; --i-butter:#F4DF98; --i-ink:#37474F; --i-light:#FFFFFF;
  --font-d:'Comfortaa','Nunito','Trebuchet MS',system-ui,sans-serif;
  --font-b:'Nunito','Segoe UI',system-ui,-apple-system,sans-serif;
  --r-lg:28px; --r-md:20px; --r-sm:14px;
  --shadow:0 1px 2px rgba(44,58,63,.05),0 8px 24px rgba(44,58,63,.06);
  --ease:cubic-bezier(.22,.7,.2,1);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#141B1E; --surface:#1D262A; --surface-2:#253136; --line:#33423F;
  --ink:#E4ECEA; --ink-2:#A3B4B2; --accent:#8CCFAE; --accent-ink:#0F241A;
  --sage:#22372D; --sky:#1F2F3D; --peach:#3A2C24; --lavender:#2B2940; --butter:#36321E; --rose:#3B2527;
  --i-rose:#C98E8E; --i-green:#7FAE8E; --i-brown:#97795F; --i-lime:#B2C27C; --i-yellow:#D8BC6D;
  --i-sky:#86ABCC; --i-peach:#D6A283; --i-lavender:#A39BCB; --i-butter:#DCC888; --i-ink:#1A2428; --i-light:#E6EEEC;
  --shadow:0 1px 2px rgba(0,0,0,.25),0 8px 24px rgba(0,0,0,.2); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141B1E; --surface:#1D262A; --surface-2:#253136; --line:#33423F;
  --ink:#E4ECEA; --ink-2:#A3B4B2; --accent:#8CCFAE; --accent-ink:#0F241A;
  --sage:#22372D; --sky:#1F2F3D; --peach:#3A2C24; --lavender:#2B2940; --butter:#36321E; --rose:#3B2527;
  --i-rose:#C98E8E; --i-green:#7FAE8E; --i-brown:#97795F; --i-lime:#B2C27C; --i-yellow:#D8BC6D;
  --i-sky:#86ABCC; --i-peach:#D6A283; --i-lavender:#A39BCB; --i-butter:#DCC888; --i-ink:#1A2428; --i-light:#E6EEEC;
  --shadow:0 1px 2px rgba(0,0,0,.25),0 8px 24px rgba(0,0,0,.2); color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font-b);font-size:17px;line-height:1.55;
  -webkit-tap-highlight-color:transparent;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
a{color:inherit}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:3px;border-radius:12px}
h1,h2,h3{font-family:var(--font-d);font-weight:700;line-height:1.2;margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:clamp(28px,5vw,40px)}
h2{font-size:clamp(20px,3vw,24px)}
h3{font-size:19px}
p{margin:0}
.wrap{max-width:1080px;margin-inline:auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.eyebrow{font-size:13px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2)}
.muted{color:var(--ink-2)}
.small{font-size:15px}
.row{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.row.center{justify-content:center}

/* ---------- верхняя панель ---------- */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:color-mix(in srgb,var(--bg) 88%,transparent);
  backdrop-filter:saturate(1.2) blur(12px);-webkit-backdrop-filter:saturate(1.2) blur(12px);border-bottom:1px solid var(--line)}
.topbar .wrap{display:flex;align-items:center;gap:20px;padding-block:10px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;font-family:var(--font-d);font-weight:700;font-size:20px;flex:none}
.brand svg{width:34px;height:34px}
.nav{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;min-width:0;margin-left:auto}
.nav::-webkit-scrollbar{display:none}
.nav a{flex:none;text-decoration:none;padding:9px 14px;border-radius:999px;font-weight:700;font-size:15px;color:var(--ink-2);transition:background .25s var(--ease),color .25s var(--ease)}
.nav a:hover{color:var(--ink)}
.nav a[aria-current="page"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
html[data-mode="child"] .topbar{display:none}
@media (max-width:640px){.topbar .wrap{flex-direction:column;align-items:stretch;gap:6px}.nav{margin-left:-6px}}

/* ---------- переходы между страницами ---------- */
main{padding-block:28px 64px;min-height:70vh}
.enter{animation:enter .42s var(--ease) both}
@keyframes enter{from{opacity:.12;transform:translateY(10px)}to{opacity:1;transform:none}}
.enter .stagger>*{animation:enter .5s var(--ease) both}
.enter .stagger>*:nth-child(2){animation-delay:60ms}
.enter .stagger>*:nth-child(3){animation-delay:120ms}
.enter .stagger>*:nth-child(4){animation-delay:180ms}
.enter .stagger>*:nth-child(5){animation-delay:240ms}

/* ---------- кнопки ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:52px;padding:0 22px;border-radius:999px;
  border:1.5px solid var(--line);background:var(--surface);text-decoration:none;font-weight:800;font-size:16px;
  transition:transform .2s var(--ease),background .2s var(--ease),box-shadow .2s var(--ease)}
.btn:hover{box-shadow:var(--shadow)}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}

/* ---------- главная ---------- */
.hero{display:grid;grid-template-columns:1.05fr 1fr;gap:32px;align-items:center;padding-block:12px 40px}
.hero h1{font-size:clamp(46px,9vw,84px);letter-spacing:-.03em;margin:6px 0 14px}
.hero .lead{font-size:clamp(17px,2.2vw,20px);color:var(--ink-2);max-width:32ch;margin-bottom:26px}
.hero-svg{width:100%;max-width:520px;height:auto;display:block;margin-inline:auto}
.float{animation:float 6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes float{50%{transform:translateY(-7px)}}
.drift{animation:drift 14s ease-in-out infinite}
@keyframes drift{50%{transform:translateX(10px)}}
@media (max-width:760px){.hero{grid-template-columns:1fr;gap:8px}.hero-art{order:-1}.hero-svg{max-width:360px}}

.section{padding-block:20px}
.section>h2{margin-bottom:16px}
.roles{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.role{display:flex;flex-direction:column;gap:10px;text-decoration:none;padding:22px;border-radius:var(--r-lg);background:var(--tint);
  transition:transform .3s var(--ease),box-shadow .3s var(--ease)}
.role:hover{transform:translateY(-3px);box-shadow:var(--shadow)}
.role svg{width:84px;height:84px}
.role p{color:var(--ink-2);font-size:16px}
.role .go{margin-top:auto;font-weight:800;font-size:15px;color:var(--accent)}
@media (max-width:760px){.roles{grid-template-columns:1fr}.role{display:grid;grid-template-columns:64px 1fr;column-gap:16px;align-items:center}.role svg{width:64px;height:64px}.role>div{min-width:0}.role .go{grid-column:2}}

.how{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(3,1fr);gap:16px;counter-reset:s}
.how li{counter-increment:s;padding:20px 22px;border-radius:var(--r-md);border:1.5px solid var(--line);display:flex;flex-direction:column;gap:6px}
.how li::before{content:counter(s);font-family:var(--font-d);font-weight:700;font-size:15px;width:34px;height:34px;border-radius:50%;
  display:grid;place-items:center;background:var(--surface-2);margin-bottom:6px}
.how p{color:var(--ink-2);font-size:16px}
@media (max-width:760px){.how{grid-template-columns:1fr}}
.demo-note{margin-top:28px;font-size:14px;color:var(--ink-2)}

/* ---------- детский режим ---------- */
.child-head{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;padding-bottom:8px}
.kid{display:flex;align-items:center;gap:16px}
.avatar{width:72px;height:72px;border-radius:50%;background:var(--sky);display:grid;place-items:center;flex:none}
.avatar svg{width:60px;height:60px}
.kid-hi{font-size:clamp(30px,6vw,44px)}
.hold{position:relative;overflow:hidden;border:1.5px solid var(--line);background:var(--surface);border-radius:999px;
  padding:10px 18px;font-size:14px;font-weight:700;color:var(--ink-2);user-select:none;-webkit-user-select:none;touch-action:none}
.hold-fill{position:absolute;inset:0;background:var(--sage);transform:scaleX(var(--p,0));transform-origin:left;transition:transform .12s linear}
.hold span:last-child{position:relative}
.stairs{margin-top:18px;padding:18px 18px 10px;border-radius:var(--r-lg);background:var(--surface);box-shadow:var(--shadow)}
.stairs svg{width:100%;max-width:440px;height:auto;display:block;margin-inline:auto}
.stairs-cap{text-align:center;font-weight:700;color:var(--ink-2);margin-top:8px}
.ball{animation:hop 2.8s ease-in-out infinite;transform-box:fill-box;transform-origin:bottom}
@keyframes hop{0%,100%{transform:none}50%{transform:translateY(-5px)}}
.tasks{display:grid;grid-template-columns:repeat(2,1fr);gap:16px;margin-top:20px}
.task{position:relative;display:flex;align-items:center;gap:18px;padding:18px;min-height:132px;border-radius:var(--r-lg);text-decoration:none;
  background:var(--tint);transition:transform .3s var(--ease),box-shadow .3s var(--ease);touch-action:manipulation}
.task:hover{box-shadow:var(--shadow)}
.task:active{transform:scale(.98)}
.task-art{width:96px;height:96px;flex:none;border-radius:24px;background:var(--surface);display:grid;place-items:center}
.task-art svg{width:78px;height:78px}
.task h3{font-size:22px;margin-bottom:4px}
.task p{color:var(--ink-2);font-size:15px}
.task .check{position:absolute;top:12px;right:14px;font-size:13px;font-weight:800;padding:4px 10px;border-radius:999px;background:var(--surface);color:var(--accent)}
.task.is-done .task-art{opacity:.75}
@media (max-width:640px){.tasks{grid-template-columns:1fr}.task{min-height:112px}.task-art{width:80px;height:80px}.task-art svg{width:64px;height:64px}}

/* ---------- упражнения ---------- */
.game{max-width:760px}
.game-top{display:flex;align-items:center;gap:14px;margin-bottom:18px}
.back{width:56px;height:56px;flex:none;border-radius:50%;display:grid;place-items:center;background:var(--surface);border:1.5px solid var(--line);text-decoration:none}
.back svg{width:24px;height:24px}
.game-title{font-size:clamp(22px,4vw,30px)}
.prompt{text-align:center;font-family:var(--font-d);font-size:clamp(22px,4.5vw,30px);margin-bottom:20px}
.prompt b{display:inline-grid;place-items:center;min-width:1.9em;height:1.9em;border-radius:16px;background:var(--butter);margin-left:6px;transition:transform .3s var(--ease)}
.prompt b.bump{animation:bump .4s var(--ease)}
@keyframes bump{40%{transform:scale(1.12)}}
.grid{display:grid;grid-template-columns:repeat(var(--n,3),1fr);gap:12px;max-width:min(460px,100%);margin-inline:auto;user-select:none;-webkit-user-select:none}
.cell{aspect-ratio:1;max-width:100%;border-radius:22px;border:2px solid var(--line);background:var(--surface);font-family:var(--font-d);font-weight:700;
  font-size:clamp(30px,8vw,46px);touch-action:manipulation;transition:background .35s var(--ease),color .35s var(--ease),transform .2s var(--ease),border-color .35s}
.cell:active{transform:scale(.96)}
.cell.ok{background:var(--sage);border-color:transparent;color:var(--ink-2)}
.cell.nudge{animation:nudge .7s var(--ease)}
@keyframes nudge{30%{background:var(--peach);border-color:transparent}}
.pick4{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.pick3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;max-width:620px;margin-inline:auto}
.pick{display:flex;flex-direction:column;align-items:center;gap:8px;padding:16px 8px 12px;border-radius:24px;border:2px solid var(--line);
  background:var(--surface);font-weight:700;font-size:15px;color:var(--ink-2);touch-action:manipulation;
  transition:transform .3s var(--ease),opacity .4s var(--ease),background .35s var(--ease),border-color .35s}
.pick svg{width:100%;max-width:112px;height:auto;aspect-ratio:1}
.pick:active{transform:scale(.97)}
.pick.ok{background:var(--sage);border-color:var(--accent);transform:translateY(-4px)}
.pick.dim{opacity:.45}
.pick.no{background:var(--surface-2)}
@media (max-width:640px){.pick4{grid-template-columns:repeat(2,1fr)}}
.feedback{min-height:56px;text-align:center;margin-top:18px;font-size:18px;font-weight:700;color:var(--ink-2)}
.dots{display:flex;justify-content:center;gap:8px;margin-top:8px}
.dots i{width:10px;height:10px;border-radius:50%;background:var(--line);transition:background .3s}
.dots i.on{background:var(--accent)}

.sched{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}
.step{position:relative;display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;padding:16px 10px;border-radius:24px;
  border:2px solid var(--line);background:var(--surface);font-weight:700;font-size:15px;transition:all .4s var(--ease)}
.step svg{width:100%;max-width:96px;height:auto;aspect-ratio:1}
.step.now{border-color:var(--accent);background:var(--butter);transform:translateY(-4px)}
.step.now::after{content:"Сейчас";position:absolute;top:-12px;font-size:12px;font-weight:800;background:var(--accent);color:var(--accent-ink);padding:2px 10px;border-radius:999px}
.step.done{opacity:.55}
.step.done svg{filter:grayscale(.5)}
.step .tick{font-size:13px;color:var(--accent);font-weight:800;min-height:20px}
@media (max-width:760px){.sched{grid-template-columns:1fr}.step{flex-direction:row;text-align:left;padding:12px 16px}.step svg{width:72px;max-width:72px}.step.now::after{top:auto;right:12px}}

.result{text-align:center;padding:24px 8px;display:flex;flex-direction:column;gap:10px;align-items:center}
.result h2{font-size:clamp(28px,5vw,38px)}
.result p{color:var(--ink-2);max-width:36ch}
.result .meta{font-size:14px}
.result .row{margin-top:14px}
.stars{display:flex;gap:10px;margin-bottom:6px}
.star{width:64px;height:64px;fill:var(--surface-2);stroke:var(--line);stroke-width:2;stroke-linejoin:round}
.star.on{fill:var(--i-butter);stroke:transparent;animation:pop .6s var(--ease) both;animation-delay:var(--d)}
@keyframes pop{from{transform:scale(.6);opacity:.3}}

/* ---------- кабинеты ---------- */
.page-head{display:flex;flex-direction:column;gap:6px;margin-bottom:22px}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:16px}
.tile{padding:18px 20px;border-radius:var(--r-md);background:var(--tint,var(--surface))}
.tile .v{font-family:var(--font-d);font-weight:700;font-size:32px;font-variant-numeric:tabular-nums;line-height:1.1;margin-top:6px}
.tile .s{color:var(--ink-2);font-size:14px;margin-top:4px}
@media (max-width:640px){.tiles{grid-template-columns:1fr}}
.two{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px}
@media (max-width:860px){.two{grid-template-columns:1fr}}
.panel{background:var(--surface);border-radius:var(--r-lg);padding:22px;box-shadow:var(--shadow);min-width:0}
.panel>h2{font-size:20px;margin-bottom:14px}
.chart{width:100%;height:auto;display:block}
.chart text{font-family:var(--font-b);font-size:12px;fill:var(--ink-2)}
.list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.list li{display:flex;justify-content:space-between;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.list li:first-child{border-top:0;padding-top:0}
.list .t{font-weight:700}
.list .w{font-size:14px;color:var(--ink-2)}
.list .r{text-align:right;font-size:15px;font-variant-numeric:tabular-nums;flex:none}
.pill{display:inline-block;font-size:13px;font-weight:800;padding:3px 10px;border-radius:999px;background:var(--surface-2);color:var(--ink-2)}
.pill.ok{background:var(--sage);color:var(--ink)}
.pill.warn{background:var(--peach);color:var(--ink)}
.pill.new{background:var(--lavender);color:var(--ink)}
.rec{padding:14px 16px;border-radius:var(--r-sm);background:var(--tint);display:flex;flex-direction:column;gap:4px}
.rec+.rec{margin-top:10px}
.rec .by{font-size:13px;font-weight:800;color:var(--ink-2)}
.form{display:grid;gap:12px}
.field{display:flex;flex-direction:column;gap:6px;font-weight:700;font-size:14px}
.field select,.field input[type=range]{width:100%}
select{min-height:48px;border-radius:14px;border:1.5px solid var(--line);background:var(--bg);padding:0 12px;font-size:16px}
input[type=range]{accent-color:var(--accent);height:32px}
.abc-e{font-size:15px;line-height:1.45}
.abc-e b{font-weight:800}

.kids{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.kidcard{display:flex;flex-direction:column;gap:12px;padding:20px;border-radius:var(--r-lg);background:var(--surface);box-shadow:var(--shadow);
  text-decoration:none;transition:transform .3s var(--ease)}
.kidcard:hover{transform:translateY(-3px)}
.kidcard .top{display:flex;align-items:center;gap:12px}
.kidcard .avatar{width:56px;height:56px}
.kidcard .avatar svg{width:46px;height:46px}
.kidcard .meta{font-size:15px;color:var(--ink-2)}
@media (max-width:860px){.kids{grid-template-columns:1fr}}
.crumbs{font-size:15px;font-weight:700;color:var(--ink-2);text-decoration:none}
.assign{display:flex;flex-direction:column}
.assign li{align-items:center}
.rate{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.rate button{min-width:44px;min-height:44px;border-radius:12px;border:1.5px solid var(--line);background:var(--bg);font-weight:800}
.rate button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}

.lib{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;align-items:start}
.mod{border-radius:var(--r-lg);background:var(--surface);box-shadow:var(--shadow);overflow:hidden;min-width:0}
.mod-h{padding:18px 20px;background:var(--tint);display:flex;align-items:center;gap:12px}
.mod-h svg{width:44px;height:44px;flex:none}
.cat{padding:14px 20px 4px}
.cat h3{font-size:14px;font-family:var(--font-b);font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2);margin-bottom:6px}
.ex{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.ex .n{font-weight:700;font-size:16px}
.ex .d{font-size:13px;color:var(--ink-2)}
.ex a{flex:none;font-size:14px;font-weight:800;color:var(--accent);text-decoration:none;padding:8px 0}
.ex .soon{flex:none;font-size:13px;color:var(--ink-2)}
@media (max-width:960px){.lib{grid-template-columns:1fr}}

@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
}

/* ===================== v2: новые модули ===================== */
.hint{ text-align:center;color:var(--ink-2);font-size:16px;margin:-10px 0 18px }
.tools{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-bottom:18px}
.chip{min-height:44px;padding:0 16px;border-radius:999px;border:1.5px solid var(--line);background:var(--surface);font-weight:700;font-size:15px;text-decoration:none;display:inline-flex;align-items:center;gap:6px}
.chip[aria-pressed="true"],.chip.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.icon-btn{width:64px;height:64px;border-radius:50%;border:1.5px solid var(--line);background:var(--surface);display:inline-grid;place-items:center;font-size:24px;touch-action:manipulation}
.icon-btn svg{width:28px;height:28px}

/* социальная история */
.story{max-width:620px;margin-inline:auto;display:flex;flex-direction:column;gap:18px;align-items:center;text-align:center}
.story-art{width:100%;max-width:340px;aspect-ratio:1;border-radius:32px;background:var(--tint,var(--sky));display:grid;place-items:center}
.story-art svg{width:72%;height:auto}
.story-text{font-size:clamp(20px,3.6vw,26px);line-height:1.45;font-weight:600;min-height:3em;text-wrap:balance}
.story-nav{display:flex;gap:12px;align-items:center;justify-content:center;flex-wrap:wrap}

/* эмпатия */
.situ{max-width:520px;margin:0 auto 18px;border-radius:28px;background:var(--surface);box-shadow:var(--shadow);padding:12px}
.situ svg{width:100%;height:auto;display:block}
.answers{display:grid;gap:12px;max-width:520px;margin-inline:auto}
.answer{min-height:64px;padding:12px 20px;border-radius:20px;border:2px solid var(--line);background:var(--surface);font-weight:700;font-size:18px;text-align:left;transition:all .35s var(--ease)}
.answer.ok{background:var(--sage);border-color:var(--accent)}
.answer.no{background:var(--surface-2)}
.answer.dim{opacity:.45}

/* дыхание и градусник */
.breath{position:relative;width:min(300px,78vw);aspect-ratio:1;margin:8px auto 18px;display:grid;place-items:center}
.breath .ring{position:absolute;inset:0;border-radius:50%;background:var(--sky);opacity:.55}
.breath .ball{position:absolute;inset:18%;border-radius:50%;background:var(--i-sky);transform:scale(.62);transition:transform 4s ease-in-out;animation:none}
.breath.in .ball{transform:scale(1)}
.breath .say{position:relative;font-family:var(--font-d);font-weight:700;font-size:26px;color:var(--i-ink)}
.thermo{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;max-width:560px;margin-inline:auto}
.thermo button{display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 4px;border-radius:20px;border:2px solid var(--line);background:var(--surface);font-weight:800;font-size:14px}
.thermo button svg{width:100%;max-width:64px;height:auto}
.thermo button[aria-pressed="true"]{border-color:var(--accent);background:var(--sage)}

/* корректурная проба / поиск */
.proof{display:grid;grid-template-columns:repeat(var(--c,6),1fr);gap:8px;max-width:560px;margin-inline:auto}
.proof button{aspect-ratio:1;border-radius:14px;border:1.5px solid var(--line);background:var(--surface);padding:6px;touch-action:manipulation;transition:background .3s var(--ease)}
.proof button svg{width:100%;height:100%;display:block}
.proof button.ok{background:var(--sage);border-color:var(--accent)}
.proof button.nudge{animation:nudge .7s var(--ease)}
.targets{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.target{display:flex;align-items:center;gap:8px;padding:6px 14px 6px 6px;border-radius:999px;background:var(--surface);border:1.5px solid var(--line);font-weight:700}
.target svg{width:40px;height:40px}
.target.ok{background:var(--sage);border-color:var(--accent)}
.room{position:relative;max-width:640px;margin-inline:auto;aspect-ratio:4/3;border-radius:28px;background:var(--surface);box-shadow:var(--shadow);overflow:hidden}
.room .thing{position:absolute;width:15%;aspect-ratio:1;border:0;background:none;padding:0;border-radius:50%;touch-action:manipulation;transition:transform .3s var(--ease)}
.room .thing svg{width:100%;height:100%}
.room .thing.ok{background:var(--sage);transform:scale(1.08)}

/* лабиринт */
.maze-wrap{max-width:440px;margin-inline:auto}
.maze-wrap svg{width:100%;height:auto;display:block;touch-action:manipulation}
.pad{display:grid;grid-template-columns:repeat(3,64px);grid-template-rows:repeat(2,64px);gap:8px;justify-content:center;margin-top:16px}
.pad button:nth-child(1){grid-column:2}
.pad button:nth-child(2){grid-column:1;grid-row:2}
.pad button:nth-child(3){grid-column:2;grid-row:2}
.pad button:nth-child(4){grid-column:3;grid-row:2}

/* память */
.show{display:flex;justify-content:center;gap:14px;flex-wrap:wrap;margin-bottom:12px}
.show .card{width:min(150px,28vw);aspect-ratio:1;border-radius:24px;background:var(--surface);box-shadow:var(--shadow);display:grid;place-items:center}
.show .card svg{width:80%;height:auto}
.pick8{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;max-width:620px;margin-inline:auto}
.pick8 .pick svg{max-width:84px}
.timer-bar{height:8px;border-radius:4px;background:var(--surface-2);max-width:360px;margin:0 auto 18px;overflow:hidden}
.timer-bar i{display:block;height:100%;background:var(--accent);opacity:.6;transform-origin:left;animation:shrink var(--t,5s) linear forwards}
@keyframes shrink{to{transform:scaleX(0)}}
.wordgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;max-width:640px;margin-inline:auto}
.wordgrid button{min-height:64px;border-radius:18px;border:2px solid var(--line);background:var(--surface);font-weight:800;font-size:18px}
.wordgrid button[aria-pressed="true"]{background:var(--sage);border-color:var(--accent)}
@media (max-width:640px){.wordgrid{grid-template-columns:repeat(2,1fr)}.pick8{grid-template-columns:repeat(2,1fr)}}
.curve{max-width:460px;margin:18px auto 0}

/* мышление */
.analogy{display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap;margin-bottom:22px}
.analogy .box{width:min(110px,22vw);aspect-ratio:1;border-radius:20px;background:var(--surface);box-shadow:var(--shadow);display:grid;place-items:center}
.analogy .box svg{width:84%;height:auto}
.analogy .box.q{background:var(--butter);font-family:var(--font-d);font-size:36px;font-weight:700;box-shadow:none;border:2px dashed var(--line)}
.analogy .op{font-family:var(--font-d);font-size:28px;color:var(--ink-2)}
.matrix{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:340px;margin:0 auto 22px;padding:14px;border-radius:28px;background:var(--surface);box-shadow:var(--shadow)}
.matrix div{aspect-ratio:1;border-radius:16px;background:var(--bg);display:grid;place-items:center}
.matrix div svg{width:80%;height:auto}
.matrix div.q{background:var(--butter);border:2px dashed var(--line);font-family:var(--font-d);font-size:30px;font-weight:700}
.opts{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;max-width:520px;margin-inline:auto}
.opts .pick{padding:10px}
.opts .pick svg{max-width:80px}
.slots{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;max-width:620px;margin:0 auto 22px}
.slot{aspect-ratio:1;border-radius:22px;border:2px dashed var(--line);display:grid;place-items:center;position:relative;background:var(--bg)}
.slot.full{border-style:solid;border-color:transparent;background:var(--surface);box-shadow:var(--shadow)}
.slot svg{width:82%;height:auto}
.slot b{position:absolute;top:6px;left:10px;font-family:var(--font-d);font-size:14px;color:var(--ink-2)}
.cipher-key{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin-bottom:18px}
.cipher-key div{display:flex;flex-direction:column;align-items:center;padding:8px 10px;border-radius:16px;background:var(--surface);box-shadow:var(--shadow);font-family:var(--font-d);font-weight:700;font-size:22px}
.cipher-key svg{width:44px;height:44px}
.cipher-row{display:grid;grid-template-columns:repeat(8,1fr);gap:8px;max-width:640px;margin:0 auto 20px}
.cipher-row div{display:flex;flex-direction:column;align-items:center;gap:6px;padding:6px 2px;border-radius:14px;transition:background .3s}
.cipher-row div.cur{background:var(--butter)}
.cipher-row svg{width:100%;max-width:52px;height:auto}
.cipher-row span{width:100%;max-width:52px;aspect-ratio:1;border-radius:12px;border:2px solid var(--line);display:grid;place-items:center;font-family:var(--font-d);font-weight:700;font-size:22px;background:var(--surface)}
.digits{display:flex;justify-content:center;gap:10px;flex-wrap:wrap}
.digits button{width:64px;height:64px;border-radius:18px;border:2px solid var(--line);background:var(--surface);font-family:var(--font-d);font-weight:700;font-size:26px}
@media (max-width:640px){.cipher-row{grid-template-columns:repeat(4,1fr)}.opts{grid-template-columns:repeat(2,1fr)}.slots{grid-template-columns:repeat(2,1fr)}}

/* логопедия */
.onto{display:grid;gap:16px}
.onto-row h3{font-size:16px;margin-bottom:10px}
.onto-row p{font-size:14px;color:var(--ink-2);margin:-6px 0 10px}
.sounds{display:flex;flex-wrap:wrap;gap:10px}
.snd{min-width:64px;height:64px;padding:0 12px;border-radius:18px;border:2px solid var(--line);background:var(--surface);font-family:var(--font-d);font-weight:700;font-size:26px;display:inline-grid;place-items:center;text-decoration:none}
.snd.has{background:var(--tint,var(--peach));border-color:transparent}
.snd[aria-disabled="true"]{opacity:.45}
.say-card{max-width:560px;margin:0 auto 18px;border-radius:32px;background:var(--surface);box-shadow:var(--shadow);padding:22px;display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center}
.say-card svg{width:120px;height:120px}
.say-word{font-family:var(--font-d);font-weight:700;font-size:clamp(30px,7vw,48px);line-height:1.2}
.say-word em{font-style:normal;color:var(--accent)}
.level{font-size:13px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2)}
.ctrl{display:flex;justify-content:center;gap:14px;flex-wrap:wrap;margin-bottom:14px}
.ctrl .btn{min-height:60px}
.rec-on{background:var(--rose)!important;border-color:transparent!important}
.rec-on::before{content:"";width:10px;height:10px;border-radius:50%;background:var(--i-rose);animation:blink 1.6s ease-in-out infinite}
@keyframes blink{50%{opacity:.25}}
.grade{display:flex;justify-content:center;gap:10px;flex-wrap:wrap}
.grade button{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 14px;border-radius:18px;border:2px solid var(--line);background:var(--surface);font-weight:700;font-size:14px}
.grade button svg{width:48px;height:48px}
.asr{font-size:15px;color:var(--ink-2);min-height:22px;text-align:center}
.yn{display:flex;justify-content:center;gap:16px}
.yn button{width:min(170px,40vw);min-height:120px;border-radius:28px;border:2px solid var(--line);background:var(--surface);font-weight:800;font-size:20px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;transition:all .35s var(--ease)}
.yn button.ok{background:var(--sage);border-color:var(--accent)}
.yn button.no{background:var(--surface-2)}
.note{max-width:620px;margin:16px auto 0;font-size:14px;color:var(--ink-2);text-align:center}

/* конструктор расписания */
.palette{display:grid;grid-template-columns:repeat(6,1fr);gap:10px}
.palette button{display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 4px;border-radius:18px;border:1.5px solid var(--line);background:var(--surface);font-size:13px;font-weight:700}
.palette svg{width:100%;max-width:56px;height:auto}
@media (max-width:640px){.palette{grid-template-columns:repeat(3,1fr)}}
.plan{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.plan li{display:flex;align-items:center;gap:12px;padding:8px 10px;border-radius:16px;background:var(--bg)}
.plan li svg{width:48px;height:48px;flex:none}
.plan li span{flex:1;font-weight:700;min-width:0}
.plan li button{width:44px;height:44px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);font-weight:800}
.lib .ex .n small{font-weight:600;color:var(--ink-2)}
.btn svg{width:20px;height:20px;flex:none}
.snd.on{border-color:var(--accent);box-shadow:0 0 0 3px var(--sage)}
/* v3: избранное */
.fav{margin-left:auto;width:48px;height:48px;flex:none;border-radius:50%;border:1.5px solid var(--line);background:var(--surface);font-size:22px;line-height:1;color:var(--ink-2)}
.fav[aria-pressed="true"]{color:var(--i-yellow);border-color:var(--i-yellow);background:var(--butter)}
.ex-act{display:flex;align-items:center;gap:10px;flex:none}
.ex-act .fav{width:40px;height:40px;font-size:18px;margin:0}
.ex-act a{flex:none;font-size:14px;font-weight:800;color:var(--accent);text-decoration:none;padding:8px 0}
.analogy .box svg{width:84%}

/* геометрические фигуры для матриц, аналогий, шифров */
const COLORS = {rose:'var(--i-rose)', sky:'var(--i-sky)', green:'var(--i-green)', yellow:'var(--i-yellow)', lavender:'var(--i-lavender)'};
function shp(kind, color='sky', s=1, fill=true){
  const c = COLORS[color]||color, st = fill ? `fill="${c}"` : `fill="none" stroke="${c}" stroke-width="7"`;
  const k = s, t = (x,y) => `${50+(x-50)*k},${50+(y-50)*k}`;
  switch(kind){
    case 'circle': return `<circle cx="50" cy="50" r="${32*k}" ${st}/>`;
    case 'square': return `<rect x="${50-30*k}" y="${50-30*k}" width="${60*k}" height="${60*k}" rx="${9*k}" ${st}/>`;
    case 'triangle': return `<path d="M${t(50,16)} L${t(86,80)} L${t(14,80)}z" ${st} stroke-linejoin="round"/>`;
    case 'star': return `<path d="M${t(50,12)} L${t(60,38)} L${t(88,39)} L${t(66,56)} L${t(74,84)} L${t(50,68)} L${t(26,84)} L${t(34,56)} L${t(12,39)} L${t(40,38)}z" ${st} stroke-linejoin="round"/>`;
    case 'heart': return `<path d="M${t(50,84)} C${t(22,64)} ${t(12,48)} ${t(14,36)} C${t(16,18)} ${t(42,14)} ${t(50,32)} C${t(58,14)} ${t(84,18)} ${t(86,36)} C${t(88,48)} ${t(78,64)} ${t(50,84)}z" ${st}/>`;
  }
}

/* ---------- озвучка: голос логопеда, если записан, иначе голос устройства ----------
   iOS разрешает звук только синхронно внутри касания. Поэтому say() ничего не ждёт
   перед speak(), а при первом касании «разблокирует» речь и аудио. */
let ruVoice = null;
function pickVoice(){ const vs = (window.speechSynthesis && speechSynthesis.getVoices()) || []; ruVoice = vs.find(v=>/^ru/i.test(v.lang) && /Milena|Милена/i.test(v.name)) || vs.find(v=>/^ru/i.test(v.lang)) || null; }
if (window.speechSynthesis){ pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; }

const player = new Audio();
player.setAttribute('playsinline', '');
const SILENT = 'data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YQAAAAA=';
let audioUnlocked = false;
function unlockAudio(){
  if (audioUnlocked) return; audioUnlocked = true;
  try { if (window.speechSynthesis){ const u = new SpeechSynthesisUtterance(' '); u.volume = 0; u.lang = 'ru-RU'; speechSynthesis.speak(u); } } catch(e){}
  try { player.src = SILENT; player.play().catch(()=>{}); } catch(e){}
}
['touchend','click','keydown'].forEach(ev => document.addEventListener(ev, unlockAudio, {capture:true, passive:true}));
let speakDone = null;
function speakTTS(text, rate=0.8){
  return new Promise(res => {
    if (!window.speechSynthesis) return res(false);
    if (speechSynthesis.speaking || speechSynthesis.pending) speechSynthesis.cancel();
    if (speakDone) speakDone(false);
    const u = new SpeechSynthesisUtterance(text); u.lang = 'ru-RU'; u.rate = rate; u.pitch = 1.05; u.volume = 1; if (ruVoice) u.voice = ruVoice;
    speakDone = res; u.onend = () => { speakDone = null; res(true); }; u.onerror = () => { speakDone = null; res(false); };
    speechSynthesis.speak(u);
    try { speechSynthesis.resume(); } catch(e){}
  });
}
const REC_KEYS = new Set();   // какие эталоны записаны: проверка без ожидания
function say(text, rate){
  const key = 'ref:'+text.toLowerCase();
  if (REC_KEYS.has(key)){ player.src = ''; return Voice.get(key).then(b => b ? Voice.play(b) : speakTTS(text, rate)); }
  return speakTTS(text, rate);
}

/* ---------- записи голоса (IndexedDB) и микрофон ---------- */
const Voice = {
  db:null,
  open(){ if (this.db) return Promise.resolve(this.db);
    return new Promise(res => { try { const r = indexedDB.open('stupeni-voice', 1);
      r.onupgradeneeded = () => r.result.createObjectStore('clips');
      r.onsuccess = () => { this.db = r.result; res(this.db); }; r.onerror = () => res(null);
    } catch(e){ res(null); } }); },
  async put(key, blob){ REC_KEYS.add(key); const db = await this.open(); if (!db) return; return new Promise(r => { const t = db.transaction('clips','readwrite'); t.objectStore('clips').put(blob, key); t.oncomplete = r; t.onerror = r; }); },
  async get(key){ const db = await this.open(); if (!db) return null; return new Promise(r => { const q = db.transaction('clips').objectStore('clips').get(key); q.onsuccess = () => r(q.result||null); q.onerror = () => r(null); }); },
  play(blob){ return new Promise(r => { if (player.src && player.src.startsWith('blob:')) URL.revokeObjectURL(player.src); player.src = URL.createObjectURL(blob); player.onended = () => r(true); player.onerror = () => r(false); player.play().catch(() => r(false)); }); },
  async loadKeys(){ const db = await this.open(); if (!db) return; try { const q = db.transaction('clips').objectStore('clips').getAllKeys(); q.onsuccess = () => (q.result||[]).forEach(k => REC_KEYS.add(k)); } catch(e){} },
  canRecord(){ return !!(window.isSecureContext && navigator.mediaDevices && navigator.mediaDevices.getUserMedia && window.MediaRecorder); },
  rec:null, chunks:[], stream:null,
  async start(){
    this.stream = await navigator.mediaDevices.getUserMedia({audio:true});
    const type = ['audio/mp4','audio/webm;codecs=opus','audio/webm'].find(t => MediaRecorder.isTypeSupported && MediaRecorder.isTypeSupported(t));
    this.rec = new MediaRecorder(this.stream, type ? {mimeType:type} : undefined); this.chunks = [];
    this.rec.ondataavailable = e => e.data.size && this.chunks.push(e.data);
    this.rec.start();
  },
  stop(){ return new Promise(r => { if (!this.rec) return r(null);
    this.rec.onstop = () => { this.stream.getTracks().forEach(t=>t.stop()); const b = new Blob(this.chunks, {type:this.rec.mimeType||'audio/mp4'}); this.rec = null; r(b); };
    this.rec.stop(); }); }
};

function recognize(){
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) return Promise.resolve(null);
  return new Promise(res => { try {
    const r = new SR(); r.lang = 'ru-RU'; r.interimResults = false; r.maxAlternatives = 3;
    let done = false; const fin = v => { if (!done){ done = true; res(v); } };
    r.onresult = e => fin([...e.results[0]].map(a => a.transcript.toLowerCase().trim()));
    r.onerror = () => fin(null); r.onend = () => fin(null);
    r.start(); setTimeout(() => { try { r.stop(); } catch(e){} }, 4000);
  } catch(e){ res(null); } });
}

function stairs(n, t){
  const w=72, base=150, h=30, x0=56; let s='';
  for (let i=0;i<t;i++){
    const hh=h*(i+1), x=x0+i*w, y=base-hh, on=i<n;
    s += `<rect x="${x}" y="${y}" width="${w-6}" height="${hh}" rx="14" fill="${on?`var(--i-${STEP_COL[i]})`:'var(--surface-2)'}" ${on?'':'stroke="var(--line)" stroke-width="2" stroke-dasharray="6 6"'}/>`;
  }
  const bx = n ? x0+(n-1)*w+(w-6)/2 : 26, by = n ? base-h*n-15 : base-15;
  return `<svg viewBox="0 0 ${x0+t*w+6} 160" role="img" aria-label="Пройдено ${n} из ${t} ступенек"><rect x="0" y="${base}" width="${x0+t*w+6}" height="6" rx="3" fill="var(--sage)"/>${s}<g class="ball"><circle cx="${bx}" cy="${by}" r="15" fill="var(--i-rose)"/><path d="M${bx-13} ${by-4}q13 6 26 0" stroke="var(--i-light)" stroke-width="4" fill="none" opacity=".8"/></g></svg>`;
}

const minutesToday = () => Math.ceil(S.attempts.filter(a=>a.day===todayKey()).reduce((s,a)=>s+a.ms,0)/60000);
function weekChart(){
  const days=['Пн','Вт','Ср','Чт','Пт','Сб','Вс'], ti=(new Date().getDay()+6)%7, base=[14,0,12,16,9,18,11];
  const vals = days.map((_,i)=> i<ti?base[i] : i===ti?minutesToday() : null);
  const W=440,H=210,L=34,B=28,T=18, max=20, bw=34, step=(W-L-10)/7, y=v=>T+(H-T-B)*(1-v/max);
  let g='';
  [0,10,20].forEach(v=>{ g+=`<line x1="${L}" x2="${W-6}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" ${v?'stroke-dasharray="3 5"':''}/><text x="${L-8}" y="${y(v)+4}" text-anchor="end">${v}</text>`; });
  vals.forEach((v,i)=>{
    const cx=L+step*i+step/2;
    if (v!==null){ const hh=Math.max(v?6:0,(H-T-B)*Math.min(v,max)/max);
      g+=`<rect x="${cx-bw/2}" y="${H-B-hh}" width="${bw}" height="${hh}" rx="9" fill="${i===ti?'var(--accent)':'var(--i-green)'}" opacity="${i===ti?1:.75}"/>`;
      g+=`<text x="${cx}" y="${H-B-hh-6}" text-anchor="middle" style="font-weight:700;fill:var(--ink)">${v}</text>`; }
    g+=`<text x="${cx}" y="${H-8}" text-anchor="middle" style="${i===ti?'font-weight:800;fill:var(--ink)':''}">${days[i]}</text>`;
  });
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Минуты занятий по дням недели">${g}</svg>`;
}

function lineChart(k){
  const W=440,H=210,L=40,B=30,T=16, xs=k.dates.length, step=(W-L-44)/(xs-1);
  const y = v => T+(H-T-B)*(1-(v-k.yMin)/(k.yMax-k.yMin)), x = i => L+8+step*i;
  const ticks = k.yMax<=3?[0,1,2,3]:k.yMax<=10?[0,5,10]:[30,40,50,60,70];
  let g='';
  ticks.forEach(v=>{ g+=`<line x1="${L}" x2="${W-6}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" ${v!==ticks[0]?'stroke-dasharray="3 5"':''}/><text x="${L-8}" y="${y(v)+4}" text-anchor="end">${v}</text>`; });
  const pts = k.vals.map((v,i)=>`${x(i)},${y(v)}`).join(' ');
  g += `<polygon points="${x(0)},${y(ticks[0])} ${pts} ${x(xs-1)},${y(ticks[0])}" fill="var(--accent)" opacity=".1"/>`;
  g += `<polyline points="${pts}" fill="none" stroke="var(--accent)" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>`;
  k.vals.forEach((v,i)=>{ const last=i===xs-1; g+=`<circle cx="${x(i)}" cy="${y(v)}" r="${last?6:3.5}" fill="${last?'var(--accent)':'var(--surface)'}" stroke="var(--accent)" stroke-width="2.5"/>`; if(last) g+=`<text x="${x(i)}" y="${y(v)-12}" text-anchor="middle" style="font-weight:800;fill:var(--ink)">${v}</text>`;
    g+=`<text x="${x(i)}" y="${H-8}" text-anchor="middle">${k.dates[i]}</text>`; });
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${k.metric}">${g}</svg>`;
}

/* --- Снижение тревожности: градусник до и после + дыхание --- */

R.calm = () => shell('Подыши с шариком');

const thermo = sel => `<div class="thermo" role="group" aria-label="Как ты себя чувствуешь">${LEVELS.map(([f,t],i)=>`<button data-act="calm-level" data-v="${i+1}" aria-pressed="${sel===i+1}">${svg(face(f))}<span>${t}</span></button>`).join('')}</div>`;
function calmRender(){
  if (G.phase==='before') $('stage').innerHTML = `<p class="prompt">Как ты себя чувствуешь сейчас?</p>${thermo(null)}`;
  if (G.phase==='breathe'){

      <div class="breath" id="breath"><div class="ring"></div><div class="ball"></div><span class="say" id="bsay">Готов?</span></div>

  if (G.phase==='after') $('stage').innerHTML = `<p class="prompt">А теперь как ты себя чувствуешь?</p>${thermo(null)}`;
}
ACT['calm-level'] = el => {
  const v = +el.dataset.v;
  if (G.phase==='before'){ G.before = v; G.phase = 'breathe'; return later(calmRender, 300); }
  clearTimeout(G.timer);
  const d = G.before - v, ms = performance.now()-G.t0;
  record('calm','Подыши с шариком', `тревога ${G.before} → ${v} из 5`, ms);

R.schulte = () => shell('Найди числа по порядку');
AFTER.schulte = () => startSchulte(G && G.n || 3);
function startSchulte(n){
  G = {n, next:1, errors:0, t0:performance.now()};
  $('stage').innerHTML = `<div class="tools" role="group" aria-label="Размер таблицы">${[3,4,5].map(k=>`<button class="chip" data-act="schulte-size" data-n="${k}" aria-pressed="${k===n}">${k}×${k}</button>`).join('')}</div>

    <div class="grid" style="--n:${n};max-width:min(${n*120}px,100%)">${shuffle([...Array(n*n)].map((_,i)=>i+1)).map(v=>`<button class="cell" data-act="cell" data-v="${v}" style="font-size:clamp(${34-n*3}px,${11-n}vw,${58-n*6}px)">${v}</button>`).join('')}</div>`;
}
ACT['schulte-size'] = el => startSchulte(+el.dataset.n);
ACT.cell = el => {
  if (el.classList.contains('ok')) return;
  const v = +el.dataset.v;

  record('schulte',`Найди числа (Шульте ${G.n}×${G.n})`, `${fmtSec(ms)}, ${errs(e)}`, ms);
  later(() => finish({stars:starsFor(e), title:'Готово!', sub:'Ты нашёл все числа по порядку.', meta:`Для взрослых: ${fmtSec(ms)}, ${errs(e)}`}), 450);
};

/* Лабиринт: случайный, проход по клеткам касанием или стрелками */
R.maze = () => shell('Помоги мячику добраться домой');
AFTER.maze = () => {
  const n = 6, walls = Array.from({length:n*n}, () => ({t:1,r:1,b:1,l:1})), seen = new Set([0]), st = [0];
  while (st.length){ const c = st[st.length-1], x = c%n, y = Math.floor(c/n);
    const nb = [[x,y-1,'t','b'],[x+1,y,'r','l'],[x,y+1,'b','t'],[x-1,y,'l','r']].filter(([a,b])=>a>=0&&b>=0&&a<n&&b<n&&!seen.has(b*n+a));
    if (!nb.length){ st.pop(); continue; }
    const [a,b,w,o] = nb[Math.floor(Math.random()*nb.length)], j = b*n+a;
    walls[c][w] = 0; walls[j][o] = 0; seen.add(j); st.push(j); }
  G = {n, walls, pos:0, moves:0, bumps:0, t0:performance.now()};
  $('stage').innerHTML = `<p class="hint">Нажимай на соседнюю клетку или на стрелки.</p><div class="maze-wrap" id="maze"></div>
    <div class="pad"><button class="icon-btn" data-act="mv" data-d="t" aria-label="Вверх">↑</button><button class="icon-btn" data-act="mv" data-d="l" aria-label="Влево">←</button><button class="icon-btn" data-act="mv" data-d="b" aria-label="Вниз">↓</button><button class="icon-btn" data-act="mv" data-d="r" aria-label="Вправо">→</button></div>`;
  drawMaze();
};
function drawMaze(){
  const {n, walls, pos} = G, c = 60, W = n*c+8; let s = '';
  walls.forEach((w,i) => { const x = 4+(i%n)*c, y = 4+Math.floor(i/n)*c;
    s += `<rect x="${x}" y="${y}" width="${c}" height="${c}" fill="transparent" stroke="none" data-act="mvto" data-i="${i}"/>`;
    if (w.t) s += `<line x1="${x}" y1="${y}" x2="${x+c}" y2="${y}"/>`; if (w.l) s += `<line x1="${x}" y1="${y}" x2="${x}" y2="${y+c}"/>`;
    if (w.b && Math.floor(i/n)===n-1) s += `<line x1="${x}" y1="${y+c}" x2="${x+c}" y2="${y+c}"/>`; if (w.r && i%n===n-1) s += `<line x1="${x+c}" y1="${y}" x2="${x+c}" y2="${y+c}"/>`;
    if (w.b && Math.floor(i/n)<n-1) s += `<line x1="${x}" y1="${y+c}" x2="${x+c}" y2="${y+c}"/>`; if (w.r && i%n<n-1) s += `<line x1="${x+c}" y1="${y}" x2="${x+c}" y2="${y+c}"/>`; });
  const g = n*n-1, px = 4+(pos%n)*c+c/2, py = 4+Math.floor(pos/n)*c+c/2;
  $('maze').innerHTML = `<svg viewBox="0 0 ${W} ${W}" role="img" aria-label="Лабиринт"><rect x="0" y="0" width="${W}" height="${W}" rx="20" fill="var(--surface)"/>
    <g stroke="var(--i-lavender)" stroke-width="6" stroke-linecap="round">${s}</g>
    <g transform="translate(${4+(g%n)*c+8} ${4+Math.floor(g/n)*c+8}) scale(.44)" pointer-events="none">${I.house}</g>
    <g style="transition:transform .25s var(--ease);transform:translate(${px-20}px,${py-20}px)" pointer-events="none"><g transform="scale(.4)">${I.ball}</g></g></svg>`;
}
const DIRS = {t:[0,-1], r:[1,0], b:[0,1], l:[-1,0]};
function step(d){
  const {n, walls, pos} = G;
  if (walls[pos][d]){ G.bumps++; return; }
  G.pos = pos + DIRS[d][0] + DIRS[d][1]*n; G.moves++; drawMaze();
  if (G.pos === n*n-1){ const ms = performance.now()-G.t0;
    record('maze','Лабиринт', `${fmtSec(ms)}, ${G.moves} шагов`, ms);
    later(() => finish({stars:starsFor(Math.floor(G.bumps/3)), title:'Мячик дома!', sub:'Ты нашёл дорогу через лабиринт.', meta:`Для взрослых: ${fmtSec(ms)}, шагов ${G.moves}, упёрся в стенку ${G.bumps} раз`}), 500); }
}
ACT.mv = el => step(el.dataset.d);
ACT.mvto = el => { const i = +el.dataset.i, {n,pos} = G, dx = i%n - pos%n, dy = Math.floor(i/n) - Math.floor(pos/n);
  if (Math.abs(dx)+Math.abs(dy) !== 1) return; step(dx===1?'r':dx===-1?'l':dy===1?'b':'t'); };

/* Поиск предметов в комнате */
const ROOM_ITEMS = ['apple','ball','cat','car','bird','book','fish','hat','gift','boat','pear','rocket'];
const SPOTS = [[6,8],[26,4],[48,10],[72,6],[84,30],[62,34],[38,36],[12,40],[20,70],[44,66],[66,68],[82,72]];
R.seek = () => shell('Найди предметы');
AFTER.seek = () => {
  const items = shuffle(ROOM_ITEMS), targets = pickN(items, 3);
  G = {items, targets, found:[], errors:0, t0:performance.now()};
  $('stage').innerHTML = `<div class="targets">${targets.map(k=>`<span class="target" id="t-${k}">${svg(I[k])}${NAMES[k]}</span>`).join('')}</div>
    <div class="room">${items.map((k,i)=>`<button class="thing" data-act="seek" data-k="${k}" style="left:${SPOTS[i][0]}%;top:${SPOTS[i][1]}%;transform:rotate(${(i*37)%30-15}deg)" aria-label="${NAMES[k]}">${svg(I[k])}</button>`).join('')}</div>`;
};
ACT.seek = el => {
  const k = el.dataset.k;
  if (!G.targets.includes(k) || G.found.includes(k)){ if (!G.found.includes(k)) G.errors++; return; }
  G.found.push(k); el.classList.add('ok'); $('t-'+k).classList.add('ok');
  if (G.found.length < G.targets.length) return;
  const ms = performance.now()-G.t0;
  record('seek','Найди предметы', `${fmtSec(ms)}, ${errs(G.errors)}`, ms);
  later(() => finish({stars:starsFor(G.errors), title:'Все нашлись!', sub:'Ты нашёл все предметы в комнате.', meta:`Для взрослых: ${fmtSec(ms)}, лишних нажатий: ${G.errors}`}), 600);

/* «10 слов» (А. Р. Лурия): проводит взрослый, до 5 повторений, кривая запоминания */
const W10 = ['лес','хлеб','окно','стул','вода','брат','конь','гриб','игла','мёд'];
R.words = () => shell('10 слов');
AFTER.words = () => { G = {trial:1, curve:[], sel:new Set(), t0:performance.now()}; wordsRender(); };
function wordsRender(){
  $('stage').innerHTML = `<p class="hint">Для взрослого. Прочитайте слова (или нажмите «Озвучить»), попросите ребёнка повторить в любом порядке и отметьте, что он назвал.</p>
    <p class="prompt">Попытка ${G.trial} из 5</p>
    <div class="row center" style="margin-bottom:18px"><button class="btn" data-act="w-read">${ICON_SPEAK} Озвучить слова</button></div>
    <div class="wordgrid">${W10.map(w=>`<button data-act="w-tog" data-w="${w}" aria-pressed="${G.sel.has(w)}">${w}</button>`).join('')}</div>
    <div class="row center" style="margin-top:18px"><button class="btn primary" data-act="w-next">Записать: ${G.sel.size} из 10</button></div>
    ${G.curve.length?`<div class="curve">${curveChart(G.curve)}</div>`:''}`;
}
function curveChart(v){
  const W=360,H=150,L=28,B=24, x=i=>L+12+i*((W-L-30)/4), y=n=>10+(H-B-10)*(1-n/10);
  let g = [0,5,10].map(n=>`<line x1="${L}" x2="${W-6}" y1="${y(n)}" y2="${y(n)}" stroke="var(--line)" ${n?'stroke-dasharray="3 5"':''}/><text x="${L-6}" y="${y(n)+4}" text-anchor="end">${n}</text>`).join('');
  g += `<polyline points="${v.map((n,i)=>`${x(i)},${y(n)}`).join(' ')}" fill="none" stroke="var(--accent)" stroke-width="3" stroke-linejoin="round"/>`;
  g += v.map((n,i)=>`<circle cx="${x(i)}" cy="${y(n)}" r="5" fill="var(--accent)"/><text x="${x(i)}" y="${y(n)-10}" text-anchor="middle" style="font-weight:800;fill:var(--ink)">${n}</text>`).join('');
  g += [1,2,3,4,5].map((t,i)=>`<text x="${x(i)}" y="${H-6}" text-anchor="middle">${t}</text>`).join('');
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Кривая запоминания">${g}</svg>`;
}
ACT['w-read'] = async el => { el.disabled = true; for (const w of W10){ await say(w, 0.75); await new Promise(r=>later(r, 700)); } el.disabled = false; };
ACT['w-tog'] = el => { const w = el.dataset.w; G.sel.has(w) ? G.sel.delete(w) : G.sel.add(w); el.setAttribute('aria-pressed', G.sel.has(w)); document.querySelector('[data-act="w-next"]').textContent = `Записать: ${G.sel.size} из 10`; };
ACT['w-next'] = () => {
  G.curve.push(G.sel.size); G.sel = new Set();
  if (G.trial < 5 && G.curve[G.curve.length-1] < 10){ G.trial++; return wordsRender(); }
  const ms = performance.now()-G.t0;
  record('words','10 слов', 'кривая '+G.curve.join('-'), ms);
  finish({stars:3, title:'Методика завершена', sub:`Кривая запоминания: ${G.curve.join(' – ')}. В норме к 4–5 попытке ребёнок 7–10 лет называет 8–10 слов.`, meta:'Результат увидит специалист'});
};

function matRender(){
  const shapes = pickN(['circle','square','triangle','star','heart'],3), cols = pickN(['sky','rose','green','yellow','lavender'],3), sizes = [.6,.8,1];

const SND_BY_LABEL = Object.fromEntries(Object.entries(SND).map(([k,v])=>[v.label,k]));
R.sounds = () => `
<section class="wrap page-head"><p class="eyebrow">Логопедия</p><h1>Выбор звука</h1><p class="muted">Звуки сгруппированы по тому, когда они обычно появляются в речи. Для цветных звуков в прототипе уже есть упражнения.</p></section>
<section class="wrap two">
  <div class="panel onto">${ONTO.map(g=>`<div class="onto-row"><h3>${g.t}</h3><p>${g.age}</p><div class="sounds">${g.s.map(l=>{ const k = SND_BY_LABEL[l];
    return k ? `<button class="snd has" data-act="snd" data-k="${k}" style="--tint:var(--peach)">${l}</button>` : `<span class="snd" aria-disabled="true">${l}</span>`; }).join('')}</div></div>`).join('')}</div>
  <div class="panel" id="sndPanel"><h2>Выберите звук</h2><p class="muted">Нажмите на Р, Л, Ш или С слева.</p></div>
</section>`;
ACT.snd = el => {
  const k = el.dataset.k, s = SND[k];
  document.querySelectorAll('.snd.has').forEach(b => b.classList.toggle('on', b===el));
  $('sndPanel').innerHTML = `<h2>Звук [${s.label}]</h2>
    <ul class="list" style="margin-top:6px">
      <li><div><p class="t">Есть звук или нет?</p><p class="w">Фонематический слух: ${s.yes.length+s.no.length} слов на слух</p></div><a class="chip" href="#phonem-${k}">Открыть</a></li>
      <li><div><p class="t">Слог → слово → фраза → предложение</p><p class="w">Автоматизация с записью голоса</p></div><a class="chip" href="#auto-${k}">Открыть</a></li>
      <li><div><p class="t">Голос логопеда</p><p class="w">Записать эталоны вместо голоса устройства</p></div><a class="chip" href="#voice-${k}">Записать</a></li>
    </ul>`;
};

/* --- Фонематический слух: есть звук в слове или нет --- */
R.phonem = k => shell(`Есть звук [${(SND[k]||SND.r).label}]?`);
AFTER.phonem = k => { k = SND[k] ? k : 'r'; const s = SND[k];
  G = {k, list:shuffle([...s.yes.map(w=>({w,y:1})), ...s.no.map(w=>({w,y:0}))]).slice(0,8), i:0, errors:0, t0:performance.now(), lock:false}; phRender(); };
function phRender(){
  const it = G.list[G.i], s = SND[G.k];
  $('stage').innerHTML = `<div class="say-card">${svg(I.ear)}<p class="level">Слово ${G.i+1} из ${G.list.length}</p>
      <p class="say-word" id="phWord" ${window.speechSynthesis?'hidden':''}>${it.w}</p>
      <button class="btn" data-act="ph-say">${ICON_SPEAK} Послушать слово</button></div>
    <p class="prompt">Слышишь звук [${s.label}]?</p>
    <div class="yn"><button data-act="ph" data-y="1">${svg(face('joy'))}Да, есть</button><button data-act="ph" data-y="0">${svg(face('calm'))}Нет</button></div>
    <p class="feedback" id="fb" aria-live="polite"></p>${dots(G.i, G.list.length)}`;
  if (G.autoSay) say(it.w, 0.7);
}
ACT['ph-say'] = () => { G.autoSay = true; say(G.list[G.i].w, 0.7); };
ACT.ph = el => {
  if (G.lock) return;
  const it = G.list[G.i], s = SND[G.k], ok = +el.dataset.y === it.y;
  const w = $('phWord'); w.hidden = false; w.innerHTML = hl(it.w, s.letter);
  if (!ok){ G.errors++; el.classList.add('no'); $('fb').textContent = it.y ? `Звук [${s.label}] есть: ${it.w}. Послушай ещё раз.` : `В слове «${it.w}» звука [${s.label}] нет.`; }
  else { el.classList.add('ok'); $('fb').textContent = it.y ? `Да! В слове «${it.w}» есть [${s.label}].` : `Верно, звука [${s.label}] нет.`; }
  G.lock = true;
  later(() => { G.lock = false;
    if (++G.i < G.list.length) return phRender();
    const ms = performance.now()-G.t0;
    record('phonem-'+G.k, `Есть звук [${s.label}]?`, `${G.list.length-G.errors} из ${G.list.length}`, ms);
    finish({stars:starsFor(G.errors), title:'Ты хорошо слышишь звуки', sub:`Ты различал слова со звуком [${s.label}] и без него.`, meta:`Для взрослых: верно ${G.list.length-G.errors} из ${G.list.length}`});
  }, ok ? 1500 : 2600);
};

/* --- Автоматизация: слог → слово → фраза → предложение --- */
const LEVEL_N = ['Слоги','Слова','Фразы','Предложения'];
R.auto = k => shell(`Звук [${(SND[k]||SND.r).label}]: говорим правильно`);
AFTER.auto = k => { k = SND[k] ? k : 'r'; const s = SND[k];
  const items = [...s.syl.slice(0,3).map(t=>({t,l:0})), ...s.words.slice(0,3).map(t=>({t,l:1})), ...s.phr.slice(0,2).map(t=>({t,l:2})), ...s.sent.slice(0,2).map(t=>({t,l:3}))];
  G = {k, items, i:0, grades:[], t0:performance.now(), blob:null, recording:false}; autoRender(); };
function autoRender(){
  const it = G.items[G.i], s = SND[G.k], pic = it.l===1 && WORD_PIC[it.t];
  const canRec = Voice.canRecord(), canAsr = !!(window.SpeechRecognition || window.webkitSpeechRecognition);
  $('stage').innerHTML = `<div class="say-card">${pic?svg(I[pic]):''}<p class="level">${LEVEL_N[it.l]} · ${G.i+1} из ${G.items.length}</p><p class="say-word">${hl(it.t, s.letter)}</p></div>
    <div class="ctrl">
      <button class="btn" data-act="au-say">${ICON_SPEAK} Послушать</button>
      ${canRec?`<button class="btn" data-act="au-rec" id="auRec">Записать себя</button><button class="btn" data-act="au-play" id="auPlay" ${G.blob?'':'disabled style="opacity:.45"'}>Прослушать себя</button>`:''}
      ${canAsr?`<button class="btn" data-act="au-asr">Проверить (ИИ)</button>`:''}
    </div>
    <p class="asr" id="asr" aria-live="polite">${canRec?'':NO_MIC}</p>
    <p class="hint" style="margin:14px 0 10px">Взрослый: как получилось?</p>
    <div class="grade">${[['joy','Получилось',2],['calm','Почти',1],['sad','Пока трудно',0]].map(([f,t,v])=>`<button data-act="au-grade" data-v="${v}">${svg(face(f))}${t}</button>`).join('')}</div>
    ${dots(G.i, G.items.length)}`;
}
ACT['au-say'] = () => say(G.items[G.i].t, 0.7);
ACT['au-rec'] = async el => {
  if (!G.recording){
    try { await Voice.start(); G.recording = true; el.classList.add('rec-on'); el.textContent = 'Остановить'; $('asr').textContent = 'Говори…'; }
    catch(e){ $('asr').textContent = 'Нет доступа к микрофону. Разрешите его в настройках Safari для этого сайта.'; }
    return;
  }
  G.blob = await Voice.stop(); G.recording = false;
  el.classList.remove('rec-on'); el.textContent = 'Записать ещё раз';
  const p = $('auPlay'); p.disabled = false; p.style.opacity = 1; $('asr').textContent = 'Запись готова. Послушай себя и сравни с образцом.';
};
ACT['au-play'] = () => G.blob && Voice.play(G.blob);
ACT['au-asr'] = async () => {
  const it = G.items[G.i]; $('asr').textContent = 'Слушаю… Скажи вслух.';
  const alts = await recognize();
  if (!alts || !alts.length){ $('asr').textContent = 'Не расслышал. Попробуй ещё раз, громче и ближе к телефону.'; return; }
  const hit = alts.some(a => norm(a).includes(norm(it.t)));
  $('asr').textContent = `Распознано: «${alts[0]}». ${hit?'Похоже на образец.':'Распознано другое слово.'} Это подсказка, оценку ставит взрослый.`;
};
ACT['au-grade'] = el => {
  G.grades.push(+el.dataset.v); G.blob = null;
  if (++G.i < G.items.length) return autoRender();
  const s = SND[G.k], ms = performance.now()-G.t0;
  const per = LEVEL_N.map((n,l) => { const g = G.items.map((it,i)=>it.l===l?G.grades[i]:null).filter(v=>v!==null); return `${n.toLowerCase()} ${g.filter(v=>v===2).length}/${g.length}`; });
  const ok = G.grades.filter(v=>v===2).length;
  record('auto-'+G.k, `Автоматизация [${s.label}]`, `${ok} из ${G.items.length} без ошибок`, ms);
  finish({stars: ok>=8?3:ok>=5?2:1, title:`Звук [${s.label}] тренируется`, sub:'Ты прошёл путь от слогов до предложений.', meta:`Для взрослых: ${per.join(', ')}`});
};

/* --- Голос логопеда: эталонные записи (хранятся на этом устройстве) --- */
R.voice = k => { k = SND[k] ? k : 'r'; const s = SND[k], all = [...s.syl, ...s.words, ...s.phr, ...s.sent];
  return `<section class="wrap page-head"><p class="eyebrow">Для специалиста</p><h1>Голос логопеда: звук [${s.label}]</h1>
    <p class="muted">Запишите эталон для каждого слога и слова. Ребёнок будет слышать ваш голос вместо голоса устройства. В прототипе записи хранятся только на этом iPhone или iPad.</p>
    <div class="row" style="margin-top:8px">${Object.entries(SND).map(([kk,v])=>`<a class="chip ${kk===k?'on':''}" href="#voice-${kk}">[${v.label}]</a>`).join('')}</div></section>
  <section class="wrap"><div class="panel">${Voice.canRecord()?'':`<p class="asr" style="text-align:left;margin-bottom:10px">${NO_MIC}</p>`}
    <ul class="list">${all.map((t,i)=>`<li><div><p class="t">${hl(t,s.letter)}</p><p class="w" id="vs-${i}">проверяю…</p></div><div class="rate">
      <button data-act="vo-rec" data-i="${i}" ${Voice.canRecord()?'':'disabled'} aria-label="Записать">●</button><button data-act="vo-play" data-i="${i}" aria-label="Прослушать">▶</button></div></li>`).join('')}</ul></div></section>`; };
AFTER.voice = k => { k = SND[k] ? k : 'r'; const s = SND[k]; G = {all:[...s.syl, ...s.words, ...s.phr, ...s.sent], rec:-1};
  G.all.forEach(async (t,i) => { const b = await Voice.get('ref:'+t.toLowerCase()); const e = $('vs-'+i); if (e) e.textContent = b ? 'Записан ваш голос' : 'Голос устройства'; }); };
ACT['vo-rec'] = async el => {
  const i = +el.dataset.i, t = G.all[i];
  if (G.rec === -1){ try { await Voice.start(); } catch(e){ $('vs-'+i).textContent = 'Нет доступа к микрофону'; return; }
    G.rec = i; el.setAttribute('aria-pressed','true'); el.textContent = '■'; $('vs-'+i).textContent = 'Идёт запись… нажмите ■'; return; }
  if (G.rec !== i) return;
  const b = await Voice.stop(); await Voice.put('ref:'+t.toLowerCase(), b);
  G.rec = -1; el.setAttribute('aria-pressed','false'); el.textContent = '●'; $('vs-'+i).textContent = 'Записан ваш голос';
};
ACT['vo-play'] = el => say(G.all[+el.dataset.i], 0.7);

/* ===================== Движки упражнений =====================
   Упражнение = запись в EX: {t: название, e: движок, mod, cat, age, tier, ...данные}.
   Маршрут #ex-<id>. Новое упражнение того же типа добавляется только данными. */
const EX = {}, ENG = {};
const ex = (id, o) => { EX[id] = o; };
CHILD.add('ex');
R.ex = id => EX[id] ? shell(EX[id].t) : `<section class="wrap"><p>Упражнение не найдено.</p></section>`;
AFTER.ex = id => { const e = EX[id]; if (e) { G = {id, e, t0:performance.now(), errors:0, lock:false}; ENG[e.e](e); } };
const done = (res, o) => { record('ex-'+G.id, G.e.t, res, performance.now()-G.t0); finish(o); };
const elapsed = () => fmtSec(performance.now()-G.t0);
/* картинка из описания: {ill}, {face}, {bear}, {svg}, {shape:[k,c,s]} */
function pic(o){
  if (!o) return '';
  if (o.ill) return svg(I[o.ill]);
  if (o.face) return svg(face(o.face, o.skin));
  if (o.bear) return svg(bear(o.bear));
  if (o.shape) return svg(shp(...o.shape));
  if (o.svg) return o.svg.startsWith('<svg') ? o.svg : svg(o.svg, o.vb);
  return '';
}

/* --- 1. Пошаговое расписание / чек-лист --- */
ENG.steps = e => { G.i = 0; stepsRender(); };
function stepsRender(){
  const st = G.e.steps;
  $('stage').innerHTML = `<p class="prompt">${G.e.prompt||'Нажми, когда сделаешь'}</p>
    <div class="sched" style="grid-template-columns:repeat(auto-fit,minmax(130px,1fr))">${st.map((s,i)=>{ const c = i<G.i?'done':i===G.i?'now':''; return `<button class="step ${c}" data-act="st" data-i="${i}">${svg(I[s.k])}<span>${s.t}</span><span class="tick">${i<G.i?'✓ Сделано':''}</span></button>`; }).join('')}</div>`;
}
ACT.st = el => {
  if (+el.dataset.i !== G.i) return;
  if (G.e.speak) say(G.e.steps[G.i].t);
  G.i++; stepsRender();
  if (G.i === G.e.steps.length) later(() => done(`${G.i} из ${G.i} шагов`, {stars:3, title:G.e.doneTitle||'Всё сделано!', sub:G.e.doneSub||'Все шаги пройдены. Ты молодец.'}), 700);
};

/* --- 2. История из страниц с озвучкой --- */
ENG.story = e => { G.p = 0; storyPage(); };
function storyPage(){
  const pg = G.e.pages[G.p], last = G.p === G.e.pages.length-1;
  $('stage').innerHTML = `<div class="story">
    <div class="story-art" style="--tint:var(--${pg.tint||'sky'})">${pic(pg)}</div>
    <p class="story-text">${pg.text}</p>
    <div class="story-nav">
      <button class="icon-btn" data-act="sp-prev" aria-label="Назад" ${G.p?'':'disabled style="opacity:.4"'}>${ICON_BACK}</button>
      <button class="btn" data-act="sp-read">${ICON_SPEAK} Прочитать</button>
      <button class="btn primary" data-act="sp-next">${last?'Конец':'Дальше'}</button>
    </div>${dots(G.p+1, G.e.pages.length)}</div>`;
}
ACT['sp-prev'] = () => { if (G.p){ G.p--; storyPage(); } };
ACT['sp-read'] = () => say(G.e.pages[G.p].text, 0.85);
ACT['sp-next'] = () => {
  if (window.speechSynthesis) speechSynthesis.cancel();
  if (G.p < G.e.pages.length-1){ G.p++; return storyPage(); }
  done('прочитана', {stars:3, title:'История прочитана', sub:G.e.moral||'Её полезно перечитывать вместе со взрослым.'});
};

/* --- 3. Выбор ответа: картинки, лица или текст --- */
ENG.choice = e => { G.r = 0; G.rounds = typeof e.rounds === 'function' ? e.rounds() : e.rounds; choiceRender(); };
function choiceRender(){
  const q = G.rounds[G.r], opts = q.keep ? q.opts : shuffle(q.opts), text = opts.every(o=>o.text && !o.ill && !o.face && !o.bear && !o.shape && !o.svg);
  G.opts = opts;
  $('stage').innerHTML = `${q.scene?`<div class="situ">${pic(q.scene)}</div>`:''}
    ${q.who?`<p class="hint" style="margin:0 0 6px"><b>${q.who}</b></p>`:''}<p class="prompt">${q.ask}</p>
    ${text ? `<div class="answers">${opts.map((o,i)=>`<button class="answer" data-act="ch" data-i="${i}">${o.text}</button>`).join('')}</div>`
           : `<div class="${opts.length===4?'pick4':'pick3'}">${opts.map((o,i)=>`<button class="pick" data-act="ch" data-i="${i}" aria-label="${o.text||''}">${pic(o)}${o.text?`<span>${o.text}</span>`:''}</button>`).join('')}</div>`}
    <p class="feedback" id="fb" aria-live="polite"></p>${dots(G.r, G.rounds.length)}`;
  if (q.speak && G.spoke) say(q.ask);
}
ACT.ch = el => { const q = G.rounds[G.r], o = G.opts[+el.dataset.i];
  choose(el, !!o.ok, o.why || q.yes || 'Верно!', o.why || q.no || 'Подумай ещё.', () => {
    if (++G.r < G.rounds.length) return choiceRender();
    done(`${G.rounds.length} из ${G.rounds.length}, ${errs(G.errors)}`, {stars:starsFor(G.errors), title:G.e.doneTitle||'Здорово!', sub:G.e.doneSub||'Ты справился со всеми заданиями.', meta:`Для взрослых: ${elapsed()}, ошибок ${G.errors}`});
  }); };

/* --- 4. Коммуникативные карточки (PECS-подобные) с озвучкой --- */
ENG.pecs = e => { G.strip = []; pecsRender(); };
function pecsRender(){
  const e = G.e;
  $('stage').innerHTML = `<div class="say-card" style="min-height:120px"><p class="level">Моя фраза</p><p class="say-word" id="strip">${G.strip.map(c=>c.say).join(' ') || '…'}</p>
      <div class="ctrl" style="margin:0"><button class="btn primary" data-act="pc-say">${ICON_SPEAK} Сказать</button><button class="btn" data-act="pc-clear">Стереть</button></div></div>
    ${e.groups.map(g=>`<p class="level" style="margin:16px 0 8px">${g.t}</p><div class="pick4">${g.cards.map((c,i)=>`<button class="pick" data-act="pc" data-g="${e.groups.indexOf(g)}" data-i="${i}">${pic(c)}<span>${c.say}</span></button>`).join('')}</div>`).join('')}
    <p class="note">Карточку можно нажать одну (она сразу озвучится) или собрать фразу из нескольких.</p>`;
}
ACT.pc = el => { const c = G.e.groups[+el.dataset.g].cards[+el.dataset.i]; G.strip.push(c); say(c.say); $('strip').textContent = G.strip.map(x=>x.say).join(' '); record('ex-'+G.id, G.e.t, 'карточка «'+c.say+'»', 0); };
ACT['pc-say'] = () => { if (G.strip.length) say(G.strip.map(x=>x.say).join(' ')); };
ACT['pc-clear'] = () => { G.strip = []; $('strip').textContent = '…'; };

/* --- 5. Собери фразу из слов --- */
ENG.phrase = e => { G.r = 0; phraseRender(); };
function phraseRender(){
  const q = G.e.rounds[G.r]; G.built = [];
  $('stage').innerHTML = `<div class="situ" style="max-width:260px">${pic(q)}</div>
    <div class="say-card" style="min-height:96px"><p class="say-word" id="built" style="font-size:clamp(22px,5vw,34px)">…</p></div>
    <div class="digits" id="words">${shuffle(q.words.map((w,i)=>({w,i}))).map(o=>`<button style="width:auto;padding:0 18px;font-size:20px" data-act="ph-w" data-i="${o.i}">${o.w}</button>`).join('')}</div>
    <p class="feedback" id="fb" aria-live="polite"></p>${dots(G.r, G.e.rounds.length)}`;
}
ACT['ph-w'] = el => {
  const q = G.e.rounds[G.r], i = +el.dataset.i;
  if (i !== G.built.length){ G.errors++; $('fb').textContent = 'Какое слово должно быть дальше?'; return; }
  G.built.push(q.words[i]); el.style.visibility = 'hidden'; $('built').textContent = G.built.join(' '); $('fb').textContent = '';
  if (G.built.length < q.words.length) return;
  const s = G.built.join(' '); say(s); $('fb').textContent = 'Отлично! ' + s + '.';
  later(() => { if (++G.r < G.e.rounds.length) return phraseRender();
    done(`${G.e.rounds.length} фразы, ${errs(G.errors)}`, {stars:starsFor(G.errors), title:'Фразы собраны', sub:'Ты собрал фразы целиком.', meta:`Для взрослых: ошибок ${G.errors}`}); }, 1800);
};

/* ===================== Движки: эмоции, совместные игры, регуляция, самооценка ===================== */

/* --- «Мой гнев»: выбрать цвет злости, «выдыхать» её, пока не станет спокойно --- */
ENG.anger = e => { G.size = 1; G.col = null; angerRender(); };
const ANGER_COLS = [['rose','красная'],['peach','оранжевая'],['yellow','жёлтая'],['lavender','фиолетовая'],['brown','коричневая']];
function angerRender(){
  if (!G.col){
    $('stage').innerHTML = `<p class="prompt">Какого цвета твоя злость?</p>
      <div class="digits">${ANGER_COLS.map(([c,n])=>`<button data-act="ang-col" data-c="${c}" aria-label="${n}" style="background:var(--i-${c});border-color:transparent"></button>`).join('')}</div>
      <p class="note">Нет правильного ответа. Выбери цвет, который подходит.</p>`;
    return;
  }
  $('stage').innerHTML = `<p class="prompt" id="angSay">Это твоя злость. Сдуй её!</p>
    <div class="breath" style="width:min(280px,72vw)"><svg viewBox="0 0 100 100" style="width:100%;height:100%;overflow:visible"><g id="blob" style="transition:transform 1.2s var(--ease);transform-origin:50px 50px;transform:scale(${G.size})">
      <path d="M50 8c14 0 18 10 28 14s16 16 12 28-2 22-14 30-26 12-38 4S6 66 8 52 14 30 24 20 36 8 50 8z" fill="var(--i-${G.col})" opacity=".85"/>
      <circle cx="38" cy="44" r="4" fill="var(--i-ink)"/><circle cx="62" cy="44" r="4" fill="var(--i-ink)"/><path d="M36 34l10 5M64 34l-10 5" stroke="var(--i-ink)" stroke-width="3.5" stroke-linecap="round"/><path d="M40 64q10-6 20 0" stroke="var(--i-ink)" stroke-width="3.5" fill="none" stroke-linecap="round"/></g></svg></div>

/* ===================== Библиотека из всех упражнений + Избранное ===================== */
const MOD_META = {'Коммуникация':{note:'Общение и совместная игра', ill:'hand', tint:'sky'}, 'Самооценка и Я-концепция':{note:'Я и мои сильные стороны', ill:'medal', tint:'butter'},
  'Дефектология':{note:'Внимание, память, мышление', ill:'eye', tint:'sky'}, 'СБО':{note:'Социально-бытовая ориентация', ill:'house', tint:'sage'}};
const MOD_ORDER = ['Психология','Коммуникация','Самооценка и Я-концепция','Дефектология','Логопедия','СБО'];
function libTree(){
  const mods = LIB.map(m => ({...m, cats:m.cats.map(c => ({...c, items:c.items.slice()}))}));
  Object.entries(EX).forEach(([id, e]) => {
    let m = mods.find(x => x.mod === e.mod);
    if (!m){ m = {mod:e.mod, ...(MOD_META[e.mod]||{note:'', ill:'star', tint:'sky'}), cats:[]}; mods.push(m); }
    let c = m.cats.find(x => x.name === e.cat); if (!c){ c = {name:e.cat, items:[]}; m.cats.push(c); }
    c.items.push({t:e.t, age:e.age, tier:e.tier, route:'ex-'+id, sub:e.sub});
  });
  return mods.sort((a,b) => MOD_ORDER.indexOf(a.mod) - MOD_ORDER.indexOf(b.mod));
}
const allItems = () => libTree().flatMap(m => m.cats.flatMap(c => c.items.map(it => ({...it, mod:m.mod}))));
const isFav = r => (S.fav||[]).includes(r);
const favBtn = r => r ? `<button class="fav" data-act="fav" data-r="${r}" aria-pressed="${isFav(r)}" aria-label="В избранное">${isFav(r)?'★':'☆'}</button>` : '';
const exRow = it => `<div class="ex"><div><p class="n">${it.t}${it.sub?` <small>· ${it.sub}</small>`:''}</p><p class="d">${it.age} · ${TIER[it.tier]}</p></div><div class="ex-act">${favBtn(it.route)}${it.route?`<a href="#${it.route}">Открыть</a>`:'<span class="soon">Скоро</span>'}</div></div>`;
R.library = () => {
  const tree = libTree(), n = tree.reduce((k,m)=>k+m.cats.reduce((j,c)=>j+c.items.length,0),0);
  const favs = allItems().filter(it => it.route && isFav(it.route));
  return `
<section class="wrap page-head"><p class="eyebrow">Библиотека упражнений</p><h1>Что можно назначить</h1><p class="muted">${n} упражнений. Звёздочка добавляет упражнение в «Избранное».</p>
  <div class="row" style="margin-top:6px">${tree.map(m=>`<a class="chip" href="#library" data-act="jump" data-m="${m.mod}">${m.mod}</a>`).join('')}</div></section>
<section class="wrap" style="margin-bottom:16px"><div class="mod"><div class="mod-h" style="--tint:var(--butter)">${svg(I.medal)}<div><h2>Избранное</h2><p class="muted small">${favs.length?plural(favs.length,'упражнение','упражнения','упражнений'):'Нажмите ☆ у любого упражнения'}</p></div></div>
  ${favs.length?`<div class="cat">${favs.map(exRow).join('')}</div>`:''}<div style="height:12px"></div></div></section>
<section class="wrap lib">
  ${tree.map(m=>`<div class="mod" id="mod-${MOD_ORDER.indexOf(m.mod)}"><div class="mod-h" style="--tint:var(--${m.tint})">${svg(I[m.ill]||I.sun)}<div><h2>${m.mod}</h2><p class="muted small">${m.note}</p></div></div>
    ${m.cats.map(c=>`<div class="cat"><h3>${c.name}</h3>${c.items.map(exRow).join('')}</div>`).join('')}<div style="height:12px"></div></div>`).join('')}
</section>`;
};
ACT.jump = el => { const m = document.getElementById('mod-'+MOD_ORDER.indexOf(el.dataset.m)); m && m.scrollIntoView({behavior:'smooth', block:'start'}); };
ACT.fav = el => {
  const r = el.dataset.r || current.raw, f = S.fav = S.fav || [];
  f.includes(r) ? f.splice(f.indexOf(r),1) : f.push(r); save();
  document.querySelectorAll(`.fav[data-r="${r}"], .fav[data-cur]`).forEach(b => { if (b.dataset.cur && r !== current.raw) return; b.setAttribute('aria-pressed', f.includes(r)); b.textContent = f.includes(r) ? '★' : '☆'; });
  if (current.route === 'library') render(true);
};

/* ===================== роутер ===================== */
['child','schedule','story','emotions','empathy','calm','schulte','proof','maze','seek','words','picto','memo','odd','analogy','matrix','sequence','cipher'].forEach(r => CHILD.add(r));
const view = document.getElementById('view');
let current = {route:'home', arg:''};
function render(keepScroll){
  if (G && G.timer) clearTimeout(G.timer);
  if (window.speechSynthesis) speechSynthesis.cancel();
  const raw = (location.hash||'').slice(1) || 'home';
  const i = raw.indexOf('-'), r = i<0?raw:raw.slice(0,i), arg = i<0?'':raw.slice(i+1);
  const route = R[r] ? r : 'home';
  current = {route, arg, raw};
  document.documentElement.dataset.mode = CHILD.has(route) ? 'child' : 'adult';
  const y = window.scrollY;
  view.innerHTML = R[route](arg);
  if (keepScroll === true) window.scrollTo(0, y);
  else { view.classList.remove('enter'); void view.offsetWidth; view.classList.add('enter'); window.scrollTo(0,0); }
  AFTER[route] && AFTER[route](arg);
  document.querySelectorAll('.fav[data-cur]').forEach(b => { const on = (S.fav||[]).includes(raw); b.setAttribute('aria-pressed', on); b.textContent = on ? '★' : '☆'; });
  const navKey = CHILD.has(route) ? 'child' : route;
  document.querySelectorAll('.nav a').forEach(a => a.getAttribute('href')==='#'+navKey ? a.setAttribute('aria-current','page') : a.removeAttribute('aria-current'));
}
let navDepth = 0;
window.addEventListener('hashchange', () => { navDepth++; render(); });
ACT.back = () => { if (navDepth > 0){ navDepth -= 2; history.back(); } else location.hash = 'child'; };
ACT.again = () => { if (G && G.timer) clearTimeout(G.timer); AFTER[current.route] && AFTER[current.route](current.arg); };
ACT.rate = el => { S.rates[el.dataset.r] = +el.dataset.v; save(); el.parentNode.querySelectorAll('button').forEach(b => b.setAttribute('aria-pressed', b===el)); };
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el || el.disabled) return;
  const fn = ACT[el.dataset.act]; if (fn){ e.preventDefault(); fn(el); }
});
render();
</script>
