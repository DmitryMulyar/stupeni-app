/* ===================== Движки партии 2: память, восприятие, графомоторика ===================== */

const pw = (n, ...f) => plural(n, ...f).replace(/^\S+ /, '');   // только слово, без числа

/* --- мягкие звуки (WebAudio): тихий синус без резких атак --- */
let AC = null;
function ac(){
  if (!AC){ const C = window.AudioContext || window.webkitAudioContext; if (!C) return null; AC = new C(); }
  if (AC.state === 'suspended') AC.resume();
  return AC;
}
function tone(f=330, d=.2, v=.4, at=0){
  const c = ac(); if (!c) return;
  if (S.calm) v *= .4;
  const t = c.currentTime + at, o = c.createOscillator(), g = c.createGain();
  o.type = 'sine'; o.frequency.value = f;
  g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(v, t+.02); g.gain.exponentialRampToValueAtTime(0.0001, t+d);
  o.connect(g); g.connect(c.destination); o.start(t); o.stop(t+d+.05);
}
/* удар «барабана» и ритмический рисунок: группы ударов, между группами пауза */
const BEAT = .34, GAP = .55;
const drum = (at=0) => tone(196, .22, .5, at);
function playBeats(groups, onBeat){
  let t = 0;
  groups.forEach((n, gi) => { for (let k=0;k<n;k++){ drum(t); if (onBeat){ const ms = t*1000; later(() => onBeat(gi, k), ms); } t += BEAT; } t += GAP; });
  return t;
}
function playCue(p){
  if (!p) return;
  if (p.say) say(p.say, p.rate || .8);
  if (p.tone) tone(...p.tone);
  if (p.beats) playBeats(p.beats);
}
/* «шум» поверх картинки: случайные мягкие линии */
const rnd = (a, b) => a + Math.random()*(b-a);
function noise(n){
  let s = '';
  for (let i=0;i<n;i++) s += `<path d="M${rnd(0,100).toFixed(0)} ${rnd(0,100).toFixed(0)}q${rnd(-30,30).toFixed(0)} ${rnd(-30,30).toFixed(0)} ${rnd(-45,45).toFixed(0)} ${rnd(-45,45).toFixed(0)}" stroke="var(--ink-2)" stroke-width="2.2" fill="none" opacity=".6" stroke-linecap="round"/>`;
  return s;
}

/* --- 1. Запомни цифры: длина ряда растёт, пока ребёнок справляется --- */
ENG.span = e => { G.len = e.start || 3; G.r = 0; G.best = 0; G.fails = 0; spanIntro(); };
function spanIntro(){
  const prev = G.seq ? 0 : 1; G.seq = [];
  while (G.seq.length < G.len){ const d = 1 + Math.floor(Math.random()*9); if (d !== G.seq[G.seq.length-1]) G.seq.push(d); }
  $('stage').innerHTML = `<p class="prompt">Запомни ${G.len} ${pw(G.len,'цифру','цифры','цифр')}</p>
    <div class="say-card" style="min-height:150px"><p class="say-word" id="dgBig" style="font-size:72px">${prev?'?':'…'}</p></div>
    <div class="row center"><button class="btn primary" data-act="dg-go" style="min-height:64px">Показать цифры</button></div>
    <p class="feedback" id="fb" aria-live="polite"></p>`;
}
ACT['dg-go'] = el => {
  el.disabled = true; let i = 0;
  const next = () => {
    if (G.e.e !== 'span' || !$('dgBig')) return;
    if (i === G.seq.length){ $('dgBig').textContent = ''; return later(spanAsk, 500); }
    $('dgBig').textContent = G.seq[i]; say(String(G.seq[i]), .9); i++; later(() => { if ($('dgBig')) $('dgBig').textContent = ''; later(next, 250); }, 850);
  };
  next();
};
function spanAsk(){
  if (!$('stage')) return;
  G.in = [];
  $('stage').innerHTML = `<p class="prompt">Нажми цифры в том же порядке</p>
    <div class="say-card" style="min-height:96px"><p class="say-word" id="dgIn" style="letter-spacing:.2em">${'·'.repeat(G.len)}</p></div>
    <div class="digits" style="max-width:260px;margin:0 auto">${[1,2,3,4,5,6,7,8,9].map(d=>`<button data-act="dg-d" data-d="${d}">${d}</button>`).join('')}</div>
    <div class="row center" style="margin-top:12px"><button class="btn" data-act="dg-del">Стереть</button></div>
    <p class="feedback" id="fb" aria-live="polite"></p>`;
}
ACT['dg-del'] = () => { G.in.pop(); $('dgIn').textContent = G.in.join('') + '·'.repeat(G.len - G.in.length); };
ACT['dg-d'] = el => {
  if (G.lock || G.in.length >= G.len) return;
  G.in.push(+el.dataset.d); $('dgIn').textContent = G.in.join('') + '·'.repeat(G.len - G.in.length);
  if (G.in.length < G.len) return;
  G.lock = true; G.r++;
  const ok = G.in.join('') === G.seq.join('');
  if (ok){ G.best = G.len; G.fails = 0; $('fb').textContent = 'Верно! Ещё на одну цифру больше.'; G.len++; }
  else { G.errors++; G.fails++; $('fb').textContent = `Было: ${G.seq.join(' ')}. ${G.fails < 2 ? 'Попробуем ещё раз.' : ''}`; }
  later(() => { G.lock = false;
    if (G.fails >= 2 || G.len > 7 || G.r >= 9){
      const b = G.best;
      return done(`запомнил ${b} ${pw(b,'цифру','цифры','цифр')}`, {stars:b>=5?3:b>=4?2:1, title:b?`Ты запомнил ${b} ${pw(b,'цифру','цифры','цифр')}`:'Хорошая тренировка', sub:'Память растёт, когда её тренируешь. Попробуй завтра ещё.', meta:`Для взрослых: объём кратковременной памяти на цифры ${b}, попыток ${G.r}`});
    }
    spanIntro();
  }, 1600);
};

/* --- 2. Опосредованное запоминание: к слову выбираем картинку-подсказку, потом по картинке вспоминаем слово --- */
ENG.mediated = e => { G.i = 0; G.pairs = []; G.list = pickN(e.words, e.n || 6); medLearn(); };
function medLearn(){
  const w = G.list[G.i];
  $('stage').innerHTML = `<p class="hint">Слово ${G.i+1} из ${G.list.length}. Правильного ответа нет: выбери картинку, которая поможет запомнить слово.</p>
    <div class="say-card" style="min-height:110px"><p class="say-word">${w.w}</p><button class="btn" data-act="md-say" style="margin-top:8px">${ICON_SPEAK} Послушать</button></div>
    <div class="pick4">${shuffle(w.pics).map(k=>`<button class="pick" data-act="md-pick" data-k="${k}">${svg(art(k))}</button>`).join('')}</div>`;
}
ACT['md-say'] = () => say(G.list[G.i].w);
ACT['md-pick'] = el => {
  G.pairs.push([G.list[G.i].w, el.dataset.k]);
  if (++G.i < G.list.length) return medLearn();
  G.r = 0; G.miss = 0; G.pairs = shuffle(G.pairs);
  $('stage').innerHTML = `<div class="say-card"><p class="say-word" style="font-size:28px">Теперь вспомним слова</p><p class="note">По картинке, которую ты выбрал, найди слово.</p></div><div class="row center"><button class="btn primary" data-act="md-go">Начать</button></div>`;
};
ACT['md-go'] = () => medTest();
function medTest(){
  const [w, k] = G.pairs[G.r], words = G.list.map(x=>x.w);
  G.opts = shuffle([w, ...pickN(words.filter(x=>x!==w), 3)]);
  $('stage').innerHTML = `<div class="situ" style="max-width:200px">${svg(art(k))}</div><p class="prompt">Какое слово ты запомнил с этой картинкой?</p>
    <div class="answers">${G.opts.map((x,i)=>`<button class="answer" data-act="md-ans" data-i="${i}">${x}</button>`).join('')}</div>
    <p class="feedback" id="fb" aria-live="polite"></p>${dots(G.r, G.pairs.length)}`;
  G.first = true;
}
ACT['md-ans'] = el => {
  const ok = G.opts[+el.dataset.i] === G.pairs[G.r][0];
  if (!ok && G.first){ G.miss++; G.first = false; }
  choose(el, ok, 'Верно! Картинка помогла.', 'Не это слово. Подумай, почему ты выбрал эту картинку.', () => {
    if (++G.r < G.pairs.length) return medTest();
    const n = G.pairs.length, got = n - G.miss;
    done(`вспомнил ${got} из ${n}`, {stars:got===n?3:got>=n-2?2:1, title:`Ты вспомнил ${got} из ${n}`, sub:'Картинки-подсказки помогают запоминать. Так можно учить и стихи, и правила.', meta:`Для взрослых: опосредованное запоминание, ${got} из ${n} с первой попытки`});
  });
};

/* --- 3. Разрезные картинки: выбери кусочек, потом место для него --- */
const CUT_GRID = {2:[2,1], 3:[3,1], 4:[2,2], 6:[3,2]};
const CUT_PICS = ['house','cat','rocket','car','bus','boat','fish','dog','cow','pig','frog','duck','umbrella','cake','tree','tomato'];
ENG.cut = e => { G.r = 0; G.done = 0; G.used = []; cutChoose(); };
function cutChoose(){
  $('stage').innerHTML = `<p class="prompt">На сколько частей разрезать картинку?</p>
    <div class="digits">${[2,3,4,6].map(n=>`<button data-act="cut-n" data-n="${n}">${n}</button>`).join('')}</div>
    <p class="note">Начните с 2 частей. Если легко, берите больше.</p>`;
}
ACT['cut-n'] = el => { G.parts = +el.dataset.n; cutRound(); };
function cutPiece(i){
  const [c, r] = CUT_GRID[G.parts], w = 100/c, h = 100/r, x = (i%c)*w, y = Math.floor(i/c)*h;
  return `<svg viewBox="${x} ${y} ${w} ${h}" aria-hidden="true"><rect width="100" height="100" fill="var(--butter)"/>${art(G.pic)}</svg>`;
}
function cutRound(){
  G.pic = pickN(CUT_PICS.filter(k=>!G.used.includes(k)), 1)[0]; G.used.push(G.pic);
  G.placed = Array(G.parts).fill(false); G.sel = null; G.tray = shuffle([...Array(G.parts).keys()]);
  if (G.parts > 1 && G.tray.every((v,i)=>v===i)) G.tray.reverse();
  cutRender();
}
function cutRender(){
  const [c, r] = CUT_GRID[G.parts];
  $('stage').innerHTML = `<div class="row center" style="gap:18px;align-items:flex-start;margin-bottom:8px">
      <div style="width:84px;text-align:center"><div class="cut-sample">${svg('<rect width="100" height="100" fill="var(--butter)"/>'+art(G.pic))}</div><p class="note" style="margin:4px 0 0">Образец</p></div>
      <div class="cut-board" style="grid-template-columns:repeat(${c},1fr)">${G.placed.map((p,i)=>`<button class="cut-slot${p?' full':''}" data-act="cut-s" data-i="${i}" style="aspect-ratio:${r}/${c}" aria-label="Место ${i+1}">${p?cutPiece(i):''}</button>`).join('')}</div></div>
    <p class="prompt" style="font-size:18px">Выбери кусочек, потом нажми, куда его положить</p>
    <div class="cut-tray">${G.tray.map(i=>G.placed[i]?'':`<button class="cut-piece" data-act="cut-p" data-i="${i}" aria-pressed="${G.sel===i}" style="aspect-ratio:${r}/${c}">${cutPiece(i)}</button>`).join('')}</div>
    <p class="feedback" id="fb" aria-live="polite"></p>${dots(G.r, 3)}`;
}
ACT['cut-p'] = el => { G.sel = +el.dataset.i; document.querySelectorAll('.cut-piece').forEach(b => b.setAttribute('aria-pressed', b===el)); };
ACT['cut-s'] = el => {
  const i = +el.dataset.i;
  if (G.lock || G.placed[i]) return;
  if (G.sel === null){ $('fb').textContent = 'Сначала выбери кусочек внизу.'; return; }
  if (G.sel !== i){ G.errors++; $('fb').textContent = 'Этот кусочек из другого места. Сравни с образцом.'; return; }
  G.placed[i] = true; G.sel = null; cutRender();
  if (!G.placed.every(Boolean)) return;
  G.lock = true; $('fb').textContent = 'Картинка собрана!';
  later(() => { G.lock = false;
    if (++G.r < 3) return cutRound();
    done(`3 картинки по ${G.parts} ${pw(G.parts,'части','части','частей')}, ${errs(G.errors)}`, {stars:starsFor(G.errors), title:'Все картинки собраны', sub:G.parts<6?'В следующий раз попробуй больше частей.':'Это была самая трудная версия. Молодец!', meta:`Для взрослых: ${G.parts} ${pw(G.parts,'часть','части','частей')}, ${elapsed()}, ошибок ${G.errors}`});
  }, 1500);
};

/* --- 4. Ритм: послушай и простучи так же --- */
const RHY = [[1,1],[2,1],[1,2],[3],[2,2],[3,1],[1,3],[2,1,2]];
ENG.rhythm = e => { G.r = 0; G.list = (e.patterns || RHY).slice(0, 6); G.taps = []; rhyRender(); };
const rhyDots = gr => gr.map(n => '●'.repeat(n)).join('  ');
function rhyRender(){
  $('stage').innerHTML = `<p class="prompt">Послушай и простучи так же</p>
    <div class="row center" style="margin-bottom:12px"><button class="btn primary" data-act="rh-play" style="min-height:60px">${ICON_SPEAK} Послушать</button></div>
    <div class="row center"><button class="drum-btn" data-act="rh-tap" aria-label="Стучать">${svg(I.drum)}</button></div>
    <p class="say-word" id="rhOut" style="min-height:44px;font-size:30px;letter-spacing:.1em" aria-live="polite"></p>
    <p class="feedback" id="fb" aria-live="polite"></p>${dots(G.r, G.list.length)}`;
}
ACT['rh-play'] = () => { G.taps = []; $('rhOut').textContent = ''; const btn = document.querySelector('.drum-btn');
  playBeats(G.list[G.r], () => { if (!btn) return; btn.classList.add('hit'); later(() => btn.classList.remove('hit'), 150); }); };
ACT['rh-tap'] = el => {
  if (G.lock) return;
  drum(); el.classList.add('hit'); later(() => el.classList.remove('hit'), 120);
  G.taps.push(performance.now()); clearTimeout(G.rt); G.rt = later(rhyCheck, 1400);
  $('rhOut').textContent = rhyDots(rhyGroups(G.taps));
};
function rhyGroups(ts){ const g = []; ts.forEach((t,i) => { if (!i || t - ts[i-1] > 560) g.push(1); else g[g.length-1]++; }); return g; }
function rhyCheck(){
  if (!$('rhOut') || !G.taps.length) return;
  const got = rhyGroups(G.taps), want = G.list[G.r]; G.taps = [];
  if (got.join() === want.join()){
    G.lock = true; $('fb').textContent = 'Верно! Ритм точно такой же.';
    return later(() => { G.lock = false; if (++G.r < G.list.length) return rhyRender();
      done(`${G.list.length} ритмов, ${errs(G.errors)}`, {stars:starsFor(G.errors), title:'У тебя хорошее чувство ритма', sub:'Ритм помогает речи и чтению: слова тоже делятся на слоги.', meta:`Для взрослых: ${elapsed()}, ошибок ${G.errors}`}); }, 1500);
  }
  G.errors++; $('fb').textContent = `Было: ${rhyDots(want)}. Послушай ещё раз и простучи.`;
}

/* --- 5. Ориентировка на листе: 9 клеток, «над», «под», «слева», «справа» --- */
const SHEET_POS = ['в левый верхний угол','вверху посередине','в правый верхний угол','слева посередине','в центр','справа посередине','в левый нижний угол','внизу посередине','в правый нижний угол'];
const SHEET_ITEMS = [{k:'apple', ins:'яблоком', gen:'яблока'}, {k:'ball', ins:'мячом', gen:'мяча'}, {k:'cat', ins:'кошкой', gen:'кошки'}, {k:'car', ins:'машиной', gen:'машины'}];
ENG.sheet = e => {
  const abs = pickN([0,1,2,3,4,5,6,7,8], 5).map(i => ({ask:'Нажми ' + SHEET_POS[i], ans:i}));
  const rel = pickN([['над',-3,'ins'],['под',3,'ins'],['слева от',-1,'gen'],['справа от',1,'gen']], 3).map(([w,d,f]) => { const it = pickN(SHEET_ITEMS,1)[0]; return {ask:`Нажми клетку ${w} ${it[f]}`, ans:4+d, item:it.k}; });
  G.r = 0; G.rounds = [...abs, ...rel]; sheetRender();
};
function sheetRender(){
  const q = G.rounds[G.r];
  $('stage').innerHTML = `<p class="prompt">${q.ask}</p>
    <div class="row center" style="margin-bottom:12px"><button class="btn" data-act="sh-say">${ICON_SPEAK} Послушать</button></div>
    <div class="sheet">${[...Array(9).keys()].map(i=>`<button class="pick" data-act="sh" data-i="${i}" aria-label="Клетка ${i+1}">${q.item&&i===4?svg(art(q.item)):''}</button>`).join('')}</div>
    <p class="feedback" id="fb" aria-live="polite"></p>${dots(G.r, G.rounds.length)}`;
}
ACT['sh-say'] = () => say(G.rounds[G.r].ask);
ACT.sh = el => { const q = G.rounds[G.r];
  if (q.item && +el.dataset.i === 4) return;
  choose(el, +el.dataset.i === q.ans, 'Верно!', 'Посмотри ещё раз. Верх — там, где начинается лист.', () => {
    if (++G.r < G.rounds.length) return sheetRender();
    done(`${G.rounds.length} заданий, ${errs(G.errors)}`, {stars:starsFor(G.errors), title:'Ты хорошо ориентируешься на листе', sub:'Это пригодится в тетради: где начинать писать и куда ставить рисунок.', meta:`Для взрослых: ${elapsed()}, ошибок ${G.errors}`});
  }); };

/* --- общая «доска» для рисования пальцем (SVG, без canvas) --- */
const padHtml = under => `<div class="draw"><svg viewBox="0 0 100 100" id="pad">${under}<g id="ink"></g></svg></div>`;
function padBind(onStroke){
  const s = $('pad'); G.strokes = []; let cur = null;
  const pt = ev => { const p = s.createSVGPoint(); p.x = ev.clientX; p.y = ev.clientY; const q = p.matrixTransform(s.getScreenCTM().inverse()); return [q.x, q.y]; };
  const draw = st => st.el.setAttribute('points', st.map(p => p[0].toFixed(1)+','+p[1].toFixed(1)).join(' '));
  s.onpointerdown = ev => { ev.preventDefault(); try { s.setPointerCapture(ev.pointerId); } catch(e){}
    cur = [pt(ev)]; cur.el = document.createElementNS('http://www.w3.org/2000/svg', 'polyline'); cur.el.setAttribute('class', 'stroke'); $('ink').appendChild(cur.el); G.strokes.push(cur); draw(cur); };
  s.onpointermove = ev => { if (!cur) return; cur.push(pt(ev)); draw(cur); };
  s.onpointerup = s.onpointercancel = () => { if (cur){ cur = null; if (onStroke) onStroke(); } };
}
ACT['pad-clear'] = () => { G.strokes = []; $('ink').innerHTML = ''; if ($('fb')) $('fb').textContent = ''; };

/* --- 6. Обведи по контуру: считаем, какая часть линии пройдена и насколько точно --- */
const TRACE = [
  {t:'волну', d:'M10 50q10-22 20 0t20 0 20 0 20 0'},
  {t:'зигзаг', d:'M10 66L25 34L40 66L55 34L70 66L85 34'},
  {t:'домик', d:'M24 82V46L50 20L76 46V82Z'},
  {t:'мячик', d:'M50 16A34 34 0 1 1 49.9 16Z'},
  {t:'звезду', d:'M50 12L60 38L88 39L66 56L74 84L50 68L26 84L34 56L12 39L40 38Z'},
  {t:'лесенку', d:'M14 80V64H30V48H46V32H62V16H80'}
];
ENG.trace = e => { G.r = 0; G.list = pickN(TRACE, 4); G.acc = []; traceRender(); };
function traceRender(){
  const t = G.list[G.r];
  $('stage').innerHTML = `<p class="prompt">Обведи ${t.t} пальцем по пунктиру</p>
    ${padHtml(`<path id="guide" class="guide" d="${t.d}"/><circle class="start" cx="${t.d.match(/M([\d.]+) ([\d.]+)/)[1]}" cy="${t.d.match(/M([\d.]+) ([\d.]+)/)[2]}" r="3"/>`)}
    <div class="row center"><button class="btn" data-act="pad-clear">Стереть</button><button class="btn primary" data-act="tr-done">Готово</button></div>
    <p class="feedback" id="fb" aria-live="polite"></p>${dots(G.r, G.list.length)}`;
  const g = $('guide'), L = g.getTotalLength();
  G.samples = [...Array(60).keys()].map(i => { const p = g.getPointAtLength(L*i/59); return [p.x, p.y]; });
  G.dense = [...Array(240).keys()].map(i => { const p = g.getPointAtLength(L*i/239); return [p.x, p.y]; });
  padBind(() => { if (traceScore().cover >= .93) traceNext(); });
}
const near = (p, list, r) => list.some(q => (p[0]-q[0])**2 + (p[1]-q[1])**2 <= r*r);
function traceScore(){
  const pts = G.strokes.flat();
  if (!pts.length) return {cover:0, acc:0};
  const cover = G.samples.filter(s => near(s, pts, 6)).length / G.samples.length;
  const acc = pts.filter(p => near(p, G.dense, 6)).length / pts.length;
  return {cover, acc};
}
ACT['tr-done'] = () => { const s = traceScore(); if (s.cover < .7){ $('fb').textContent = 'Обведи всю линию до конца.'; return; } traceNext(); };
function traceNext(){
  if (G.lock) return; G.lock = true;
  const s = traceScore(); G.acc.push(s.acc);
  $('fb').textContent = s.acc > .85 ? 'Очень точно!' : s.acc > .65 ? 'Хорошо получилось!' : 'Получилось! Старайся вести палец по пунктиру.';
  later(() => { G.lock = false;
    if (++G.r < G.list.length) return traceRender();
    const a = G.acc.reduce((x,y)=>x+y,0)/G.acc.length, pc = Math.round(a*100);
    done(`точность ${pc}%`, {stars:a>.85?3:a>.65?2:1, title:'Все фигуры обведены', sub:'Такие упражнения готовят руку к письму.', meta:`Для взрослых: средняя точность ведения линии ${pc}%`});
  }, 1300);
}

/* --- 7. Дорисуй: оценки нет, важен сам рисунок и рассказ о нём --- */
ENG.draw = e => { G.r = 0; G.list = e.items; drawRender(); };
function drawRender(){

  $('stage').innerHTML = `<p class="prompt">${it.ask}</p>${padHtml(it.base)}
    <div class="row center"><button class="btn" data-act="pad-clear">Стереть</button><button class="btn primary" data-act="dr-next">Готово</button></div>

}
ACT['dr-next'] = () => {

  if (++G.r < G.list.length) return drawRender();

};

/* --- 8. Соедини точки по порядку --- */
const CONNECT = [
  {t:'Звезда', c:'yellow', p:[[50,10],[61,37],[90,38],[67,56],[75,86],[50,69],[25,86],[33,56],[10,38],[39,37]]},
  {t:'Домик', c:'peach', p:[[22,86],[22,46],[50,16],[78,46],[78,86]]},
  {t:'Рыбка', c:'sky', p:[[10,50],[30,30],[56,26],[74,40],[92,24],[92,76],[74,60],[56,74],[30,70]]},
  {t:'Кораблик', c:'rose', p:[[8,56],[92,56],[76,82],[24,82]]},
  {t:'Ёлочка', c:'green', p:[[50,8],[70,34],[60,34],[80,60],[64,60],[86,86],[14,86],[36,60],[20,60],[40,34],[30,34]]},
  {t:'Ромб', c:'lavender', p:[[50,10],[86,50],[50,90],[14,50]]}
];
ENG.connect = e => { G.r = 0; G.list = pickN(CONNECT, 3); conRound(); };
function conRound(){ G.k = 0; conRender(); }
function conRender(){
  const f = G.list[G.r], pts = f.p, fin = G.k === pts.length;
  const line = pts.slice(0, G.k).map(p=>p.join(',')).join(' ');
  const lab = (p, i) => { const cx = 50, cy = 50, dx = p[0]-cx, dy = p[1]-cy, l = Math.hypot(dx,dy)||1; return [p[0]+dx/l*7, p[1]+dy/l*7+2]; };

      ${pts.map((p,i)=>`<g data-act="cn" data-i="${i}"><circle cx="${p[0]}" cy="${p[1]}" r="7" fill="transparent"/><circle cx="${p[0]}" cy="${p[1]}" r="${i===G.k?3.4:2.4}" fill="${i<G.k?'var(--accent)':'var(--ink)'}"/><text x="${lab(p,i)[0]}" y="${lab(p,i)[1]}" font-size="6.5" font-weight="700" text-anchor="middle" fill="var(--ink-2)">${i+1}</text></g>`).join('')}

}
ACT.cn = el => {
  if (G.lock) return;

  if (i !== G.k){ G.errors++; $('fb').textContent = `Ищи число ${G.k+1}.`; return; }
  G.k++; conRender();
  if (G.k < f.p.length) return;
  G.lock = true; say(f.t);
  later(() => { G.lock = false;
    if (++G.r < G.list.length) return conRound();
    done(`${G.list.length} фигуры, ${errs(G.errors)}`, {stars:starsFor(G.errors), title:'Все фигуры готовы', sub:'Ты хорошо знаешь порядок чисел.', meta:`Для взрослых: ${elapsed()}, ошибок ${G.errors}`});
  }, 1600);
};

/* --- 9. Графический диктант: стрелки по клеткам --- */
const DIR = {r:[1,0,'→','вправо'], l:[-1,0,'←','влево'], u:[0,-1,'↑','вверх'], d:[0,1,'↓','вниз']};
const GD = [
  {t:'Лесенка', s:[1,8], steps:'u1 r1 u1 r1 u1 r1 u1 r1 u1 r1 u1 r1'},
  {t:'Крепостная стена', s:[1,7], steps:'u2 r1 d2 r1 u2 r1 d2 r1 u2 r1 d2 r1'},
  {t:'Змейка', s:[1,6], steps:'u2 r2 d2 r2 u2 r2 d2 r2'},
  {t:'Ключик', s:[1,5], steps:'r6 u1 r3 d3 l3 u2'},
  {t:'Ступеньки вниз', s:[1,1], steps:'r2 d1 r2 d1 r2 d1 r2 d1 r2 d1'}
];
const CELL = 7, GW = 14, GH = 10;
ENG.gdict = e => { G.r = 0; G.list = pickN(GD.slice(0,3), 2).concat(pickN(GD.slice(3), 1)); gdRound(); };
function gdRound(){
  const p = G.list[G.r]; G.steps = p.steps.split(' ').map(x => [x[0], +x.slice(1)]);
  G.s = 0; G.cnt = 0; G.pos = p.s.slice(); G.path = [p.s.slice()]; gdRender();
}
function gdRender(){
  const W = GW*CELL, H = GH*CELL, P = G.list[G.r];
  let grid = '';
  for (let x=0;x<=GW;x++) grid += `<path d="M${x*CELL} 0V${H}" stroke="var(--line)" stroke-width=".5"/>`;
  for (let y=0;y<=GH;y++) grid += `<path d="M0 ${y*CELL}H${W}" stroke="var(--line)" stroke-width=".5"/>`;
  const pts = G.path.map(([x,y]) => `${x*CELL},${y*CELL}`).join(' '), [cx, cy] = G.pos;
  $('stage').innerHTML = `<p class="prompt">${P.t}</p>
    <div class="gd-steps">${G.steps.map(([d,n],i)=>`<span class="${i<G.s?'ok':i===G.s?'now':''}">${n}${DIR[d][2]}</span>`).join('')}</div>
    <div class="draw" style="width:min(520px,94vw)"><svg viewBox="-2 -2 ${W+4} ${H+4}">${grid}<polyline points="${pts}" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><circle cx="${cx*CELL}" cy="${cy*CELL}" r="2.6" fill="var(--i-rose)"/></svg></div>
    <div class="arrows"><span></span><button data-act="gd" data-d="u" aria-label="Вверх">↑</button><span></span><button data-act="gd" data-d="l" aria-label="Влево">←</button><button data-act="gd" data-d="d" aria-label="Вниз">↓</button><button data-act="gd" data-d="r" aria-label="Вправо">→</button></div>
    <div class="row center" style="margin-top:10px"><button class="btn" data-act="gd-say">${ICON_SPEAK} Продиктовать</button></div>
    <p class="feedback" id="fb" aria-live="polite"></p>${dots(G.r, G.list.length)}`;
}
const cellsWord = n => `${n===1?'одна':n===2?'две':n} ${pw(n,'клетка','клетки','клеток')}`;
ACT['gd-say'] = () => { const st = G.steps[G.s]; if (!st) return; const left = st[1] - G.cnt; say(`${cellsWord(left)} ${DIR[st[0]][3]}`); };
ACT.gd = el => {
  if (G.lock) return;
  const st = G.steps[G.s], d = el.dataset.d;
  if (d !== st[0]){ G.errors++; $('fb').textContent = `Сейчас нужно ${DIR[st[0]][3]}. Посмотри на подсвеченную стрелку.`; return; }
  G.pos = [G.pos[0]+DIR[d][0], G.pos[1]+DIR[d][1]]; G.path.push(G.pos.slice());
  if (++G.cnt === st[1]){ G.s++; G.cnt = 0; }
  gdRender();
  if (G.s < G.steps.length) return;
  G.lock = true; $('fb').textContent = `Готово: ${G.list[G.r].t.toLowerCase()}!`;
  later(() => { G.lock = false;
    if (++G.r < G.list.length) return gdRound();
    done(`${G.list.length} узора, ${errs(G.errors)}`, {stars:starsFor(G.errors), title:'Графический диктант написан', sub:'Ты различаешь право и лево, верх и низ.', meta:`Для взрослых: ${elapsed()}, ошибок направления ${G.errors}`});
  }, 1500);
};

/* --- 1. Таймер по шагам (чистим зубы, моем руки): круг показывает, сколько осталось --- */
ENG.timer = e => { G.ph = 0; G.left = e.phases[0].s; G.run = false; timerRender(); };
function timerRender(){
  const e = G.e, ph = e.phases[G.ph], total = e.phases.reduce((a,p)=>a+p.s, 0);
  const spent = e.phases.slice(0, G.ph).reduce((a,p)=>a+p.s, 0) + (ph.s - G.left), C = 2*Math.PI*44;
  $('stage').innerHTML = `<div class="tm">
      <svg viewBox="0 0 100 100" class="tm-ring"><circle cx="50" cy="50" r="44" fill="none" stroke="var(--surface-2)" stroke-width="7"/>
        <circle id="tmArc" cx="50" cy="50" r="44" fill="none" stroke="var(--accent)" stroke-width="7" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C*(1-spent/total)}" transform="rotate(-90 50 50)" style="transition:stroke-dashoffset .9s linear"/>
        <g transform="translate(21 10) scale(.58)">${art(ph.k)}</g>
        <text id="tmSec" x="50" y="84" text-anchor="middle" font-size="11" font-weight="800" fill="var(--ink-2)">${G.left} сек</text></svg></div>
    <p class="prompt" id="tmTxt">${ph.t}</p>
    <div class="row center"><button class="btn primary" data-act="tm-go" style="min-height:64px;padding:0 34px">${G.run?'Пауза':G.ph||G.left<ph.s?'Продолжить':'Старт'}</button></div>
    <p class="note">${e.note||''}</p>${dots(G.ph, e.phases.length)}`;
}
ACT['tm-go'] = () => {
  G.run = !G.run; timerRender();
  if (G.run){ say(G.e.phases[G.ph].t); tick(); } else clearTimeout(G.timer);
};
function tick(){
  G.timer = later(() => {
    if (!G.run || !$('tmSec')) return;
    G.left--;
    if (G.left <= 0){
      tone(523, .35, .25);
      if (++G.ph >= G.e.phases.length){ G.run = false; return done('выполнено', {stars:3, title:G.e.doneTitle||'Готово!', sub:G.e.doneSub||'Ты всё сделал по шагам.'}); }
      G.left = G.e.phases[G.ph].s; timerRender(); say(G.e.phases[G.ph].t);
    } else timerRender();
    tick();
  }, 1000);
}

/* --- 2. Чек-лист: отмечай в любом порядке --- */

  if (G.lock) return;
  const p = G.list[G.r][2], sum = G.tray.reduce((a,b)=>a+b, 0);
  if (sum !== p){ G.errors++; $('fb').textContent = sum < p ? `Не хватает ${p-sum} ₽.` : `Это больше, чем нужно, на ${sum-p} ₽. Убери монету.`; return; }
  G.lock = true; $('fb').textContent = 'Спасибо за покупку!'; say('Спасибо за покупку!');
  later(() => { G.lock = false; if (++G.r < G.list.length) return payRound();
    done(`${G.list.length} покупки, ${errs(G.errors)}`, {stars:starsFor(G.errors), title:'Ты умеешь платить на кассе', sub:'Попробуйте так же в магазине с настоящими монетами.', meta:`Для взрослых: ${elapsed()}, ошибок ${G.errors}`}); }, 1500);
};

const nums = (n, spread=[1,-1,2]) => shuffle([n, ...spread.map(d=>n+d).filter(x=>x>=0 && x!==n)]).slice(0,3);
const numOpts = (n, spread) => { const s = new Set(nums(n, spread)); s.add(n); return [...s].map(x => ({text:String(x), ok:x===n})); };

  let perm; do { perm = shuffle([0,1,2]); } while (perm.every((v,i) => v===i));
  const paths = L.map((_, i) => `<path d="M24 ${ys[i]}C${rnd(36,46).toFixed(0)} ${rnd(0,100).toFixed(0)} ${rnd(54,64).toFixed(0)} ${rnd(0,100).toFixed(0)} 76 ${ys[perm[i]]}" fill="none" stroke="var(--ink-2)" stroke-width="1.8" stroke-linecap="round"/>`).join('');
  const q = Math.floor(Math.random()*3);
  return {scene:{svg:`<svg viewBox="0 0 100 100" aria-hidden="true">${paths}${L.map((k,i)=>put(k,2,ys[i]-11,22)).join('')}${Rt.map((k,j)=>put(k,77,ys[j]-11,22)).join('')}</svg>`},

}

function compareRound(type){
  const k = pickN(['circle','square','star','heart','triangle'],1)[0], col = pickN(Object.keys(COLORS),1)[0];
  if (type === 'size'){ const big = Math.random()<.5;
    return {ask:big?'Где фигура больше?':'Где фигура меньше?', opts:[{shape:[k,col,1], ok:big}, {shape:[k,col,.55], ok:!big}]}; }
  if (type === 'len'){ const long = Math.random()<.5, bar = w => ({svg:`<svg viewBox="0 0 100 100" aria-hidden="true"><rect x="${50-w/2}" y="42" width="${w}" height="16" rx="8" fill="var(--i-${col})"/></svg>`});
    return {ask:long?'Какая полоска длиннее?':'Какая полоска короче?', opts:[{...bar(86), ok:long}, {...bar(50), ok:!long}]}; }
  if (type === 'more'){ const a = 2+Math.floor(Math.random()*4), b = a+1+Math.floor(Math.random()*3);
    return {ask:'Где яблок больше?', opts:[{...groupPic(b), ok:1}, groupPic(a)]}; }
  const n = 3+Math.floor(Math.random()*4);
  return {scene:groupPic(n,'pear'), ask:'Где яблок столько же, сколько груш?', opts:[{...groupPic(n), ok:1}, groupPic(n+1), groupPic(n-1)]};
}

function mathRound(type){
  if (type === 'count'){ const n = 3+Math.floor(Math.random()*7), k = pickN(['apple','ball','fish','duck'],1)[0];
    return {scene:groupPic(n,k), ask:'Сколько здесь предметов?', opts:numOpts(n)}; }
  if (type === 'add'){ const a = 1+Math.floor(Math.random()*4), b = 1+Math.floor(Math.random()*3);
    return {scene:{svg:`<svg viewBox="0 0 200 64" aria-hidden="true">${grpSvg(a,'apple',4,22)}<text x="104" y="40" font-size="30" font-weight="700" fill="var(--ink)">+</text><g transform="translate(118 0)">${grpSvg(b,'apple',3,22)}</g></svg>`},
      ask:`Было ${a}, дали ещё ${b}. Сколько стало?`, opts:numOpts(a+b)}; }
  if (type === 'sub'){ const a = 4+Math.floor(Math.random()*5), b = 1+Math.floor(Math.random()*3);
    return {ask:`Было ${a} ${pw(a,'шарик','шарика','шариков')}. ${b} ${pw(b,'улетел','улетели','улетели')}. Сколько осталось?`, scene:{ill:'balloon'}, opts:numOpts(a-b)}; }
  if (type === 'next'){ const n = 2+Math.floor(Math.random()*8);
    return {ask:`Какое число идёт после ${n}?`, opts:numOpts(n+1, [-1,1,-2])}; }
  const st = 1+Math.floor(Math.random()*3), d = 2, s = [st, st+d, st+2*d];
  return {ask:`Продолжи ряд: ${s.join(', ')}, …`, opts:numOpts(st+3*d, [-1,1,2])};
}

function mechRound(type){

    return {scene:{svg:`<svg viewBox="0 0 100 92" aria-hidden="true"><path d="M50 52L38 88h24z" fill="var(--i-brown)"/><g transform="rotate(${ang} 50 50)"><rect x="8" y="48" width="84" height="5" rx="2.5" fill="var(--ink-2)"/>${put(a,8,26,24)}${put(b,68,26,24)}</g><circle cx="50" cy="50" r="3.5" fill="var(--ink)"/></svg>`},

  const cw = Math.random()<.5, three = type === 'gear3';
  const sc = three ? `${gear(20,50,13,9,'sky')}${gear(50,50,13,9,'yellow')}${gear(80,50,13,9,'rose')}${spin(20,50,22,cw)}`
                   : `${gear(30,50,18,11,'sky')}${gear(71,50,18,11,'rose')}${spin(30,50,28,cw)}`;
  const same = three, ans = same ? cw : !cw;
  return {scene:{svg:`<svg viewBox="0 0 100 100" aria-hidden="true">${sc}</svg>`}, keep:true,
    ask:`Голубая шестерёнка крутится, как показывает стрелка. Как будет крутиться розовая?`,
    yes:three?'Верно! Через одну шестерёнку направление меняется дважды.':'Верно! Соседние шестерёнки крутятся в разные стороны.', no:'Соседние шестерёнки всегда крутятся в разные стороны.',
    opts:[{text:'По часовой стрелке ↻', ok:ans}, {text:'Против часовой стрелки ↺', ok:!ans}]};
}

const MOD_META = {'Коммуникация':{note:'Общение и совместная игра', ill:'hand', tint:'sky'}, 'Самооценка и Я-концепция':{note:'Я и мои сильные стороны', ill:'medal', tint:'butter'},

const MOD_ORDER = ['Психология','Коммуникация','Самооценка и Я-концепция','Дефектология','Логопедия','СБО'];
function libTree(){
  const mods = LIB.map(m => ({...m, cats:m.cats.map(c => ({...c, items:c.items.slice()}))}));
  Object.entries(EX).forEach(([id, e]) => {
    let m = mods.find(x => x.mod === e.mod);
    if (!m){ m = {mod:e.mod, ...(MOD_META[e.mod]||{note:'', ill:'star', tint:'sky'}), cats:[]}; mods.push(m); }
    let c = m.cats.find(x => x.name === e.cat); if (!c){ c = {name:e.cat, items:[]}; m.cats.push(c); }
    c.items.push({t:e.t, age:e.age, tier:e.tier, route:'ex-'+id, sub:e.sub});
  });
  return mods.sort((a,b) => MOD_ORDER.indexOf(a.mod) - MOD_ORDER.indexOf(b.mod));
}
const allItems = () => libTree().flatMap(m => m.cats.flatMap(c => c.items.map(it => ({...it, mod:m.mod}))));

</section>`;
};

/* ---------- 1. Фильтры библиотеки ---------- */
const AGE_F = [['','Любой'],['3','3–4'],['5','5–6'],['7','7+']];
const TIER_F = [['','Все'],['free','Бесплатно'],['paid','Подписка']];
const BLOCK_F = [['','Все'],['Психология','Психология'],['Дефектология','Дефектология'],['Логопедия','Логопедия'],['СБО','СБО']];
const BLOCK_OF = m => ['Коммуникация','Самооценка и Я-концепция'].includes(m) ? 'Психология' : m;
function ageFits(age, f){
  if (!f) return true;
  const m = String(age).match(/(\d+)\D+(\d+)/); if (!m) return false;
  const lo = +m[1], hi = +m[2], [a, b] = f==='3' ? [3,4] : f==='5' ? [5,6] : [7,99];
  return lo <= b && hi >= a;
}
const itemFits = (it, mod, f) => ageFits(it.age, f.age) && (!f.tier || (f.tier==='free' ? it.tier==='free' : it.tier!=='free')) && (!f.block || BLOCK_OF(mod)===f.block);
function filtTree(f){
  return libTree().map(m => ({...m, cats:m.cats.map(c => ({...c, items:c.items.filter(it => itemFits(it, m.mod, f))})).filter(c => c.items.length)})).filter(m => m.cats.length);
}
const filtBar = (f, act) => `<div class="filters">
  ${[['age','Возраст',AGE_F],['tier','Доступ',TIER_F],['block','Блок',BLOCK_F]].map(([k,t,opts]) => `<div class="fgroup"><span class="flabel">${t}</span><div class="seg">${opts.map(([v,l]) => `<button data-act="${act}" data-k="${k}" data-v="${v}" aria-pressed="${(f[k]||'')===v}">${l}</button>`).join('')}</div></div>`).join('')}</div>`;
R.library = () => {
  const f = S.filt = S.filt || {}, tree = filtTree(f), n = tree.reduce((k,m)=>k+m.cats.reduce((j,c)=>j+c.items.length,0),0), any = f.age||f.tier||f.block;
  const favs = allItems().filter(it => it.route && isFav(it.route));
  return `
<section class="wrap page-head"><p class="eyebrow">Библиотека упражнений</p><h1>Что можно назначить</h1>
  ${filtBar(f, 'filt')}
  <p class="muted small" style="margin-top:10px">${any ? `Найдено: ${plural(n,'упражнение','упражнения','упражнений')}. <button class="linkbtn" data-act="filt-reset">Сбросить фильтры</button>` : `${plural(n,'упражнение','упражнения','упражнений')}. Звёздочка добавляет в «Избранное».`}</p></section>
${!any && favs.length ? `<section class="wrap" style="margin-bottom:16px"><div class="mod"><div class="mod-h" style="--tint:var(--butter)">${svg(I.medal)}<div><h2>Избранное</h2><p class="muted small">${plural(favs.length,'упражнение','упражнения','упражнений')}</p></div></div><div class="cat">${favs.map(exRow).join('')}</div><div style="height:12px"></div></div></section>` : ''}
<section class="wrap lib">
  ${tree.length ? tree.map(m=>`<div class="mod"><div class="mod-h" style="--tint:var(--${m.tint})">${svg(I[m.ill]||I.sun)}<div><h2>${m.mod}</h2><p class="muted small">${m.note}</p></div></div>
    ${m.cats.map(c=>`<div class="cat"><h3>${c.name}</h3>${c.items.map(exRow).join('')}</div>`).join('')}<div style="height:12px"></div></div>`).join('') : '<div class="panel"><p>Под эти фильтры ничего нет. Попробуйте другой возраст или блок.</p></div>'}
</section>`;
};

function icsFor(r){
  const [h, m] = r.time.split(':').map(Number), order = WD.map(w=>w[0]);
  let d = new Date(); d.setHours(h, m, 0, 0);
  for (let i=0;i<8;i++){ const wd = order[(d.getDay()+6)%7]; if (r.days.includes(wd) && d > new Date()) break; d.setDate(d.getDate()+1); }
  const p = n => String(n).padStart(2,'0'), loc = `${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}T${p(h)}${p(m)}00`;
  const title = r.kind === 'home' ? 'Ступени: домашнее задание' : 'Ступени: занятие в центре';
  const text = r.kind === 'home' ? 'Пора позаниматься 10–15 минут. Откройте Ступени.' : 'Сегодня занятие в центре. Возьмите сменную обувь.';
  const now = new Date().toISOString().replace(/[-:]/g,'').slice(0,15)+'Z';
  return ['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Stupeni//RU','CALSCALE:GREGORIAN','BEGIN:VEVENT',`UID:${Date.now()}@stupeni`,`DTSTAMP:${now}`,`DTSTART:${loc}`,'DURATION:PT20M',
    `RRULE:FREQ=WEEKLY;BYDAY=${r.days.join(',')}`,`SUMMARY:${title}`,`DESCRIPTION:${text}`,`URL:${location.origin}${location.pathname}#child`,
    'BEGIN:VALARM','ACTION:DISPLAY','TRIGGER:-PT5M',`DESCRIPTION:${title}`,'END:VALARM','END:VEVENT','END:VCALENDAR'].join('\r\n');
}
const standalone = () => window.navigator.standalone || matchMedia('(display-mode: standalone)').matches;

  const a = document.createElement('a'); a.href = URL.createObjectURL(file); a.download = name; document.body.appendChild(a); a.click(); a.remove(); later(() => URL.revokeObjectURL(a.href), 4000);
  return 'download';
}

  if (!r.days.length){ $('rmMsg').textContent = 'Выберите хотя бы один день.'; return; }
  const how = await giveFile('stupeni-napominanie.ics', 'text/calendar', icsFor(r));
  $('rmMsg').textContent = how === 'share' ? 'Выберите «Календарь» или сохраните файл и откройте его.' : how === 'cancel' ? '' : 'Нажмите «Добавить всё», когда iPhone покажет событие. Если ничего не открылось, откройте сайт в Safari и повторите.';
};
/* в приложении: напоминание, если задания на сегодня не сделаны */
function remindBanner(){
  const r = S.remind; if (!r || r.kind !== 'home') return '';
  const wd = WD[(new Date().getDay()+6)%7][0], [h, m] = r.time.split(':').map(Number), now = new Date();
  if (!r.days.includes(wd) || now.getHours()*60+now.getMinutes() < h*60+m) return '';
  const left = TASKS.filter(t => !S.done.includes(t.id)).length;
  return left ? `<div class="banner">${svg(I.clock)}<p><b>Напоминание:</b> сегодня не сделано: ${plural(left,"задание","задания","заданий")}. <a href="#child">Открыть детский режим</a></p></div>` : '';
}

/* ---------- 9. Офлайн-набор ---------- */
function offlinePanel(){
  const cards = EX['com-cards'] ? EX['com-cards'].groups.reduce((n,g)=>n+g.cards.length,0) : 0, st = Object.keys(EX).filter(k=>EX[k].e==='story').length + 1;
  return `<div class="panel"><h2>Без интернета</h2>
    <p class="muted small" id="offState" style="margin-bottom:12px">Проверяю…</p>
    <p class="small" style="margin-bottom:12px">Карточки «Я хочу» (${cards}) и социальные истории (${st}) можно сохранить файлом. Он открывается без интернета и печатается на A4.</p>
    <div class="row"><button class="btn primary" data-act="off-file">Скачать карточки и истории</button><button class="btn" data-act="off-sync">Обновить копию в приложении</button></div>
    <p class="feedback" id="offMsg" aria-live="polite" style="text-align:left"></p></div>`;
}
async function offState(){
  const el = $('offState'); if (!el) return;
  let ok = false; try { ok = !!(navigator.serviceWorker && navigator.serviceWorker.controller) && (await caches.keys()).length > 0; } catch(e){}
  el.textContent = ok ? 'Приложение сохранено на этом устройстве. Все упражнения, карточки и истории работают без интернета.' : 'Офлайн-копия появится после первого открытия сайта по HTTPS (с иконки на экране «Домой»).';
}
ACT['off-sync'] = async () => {
  try { const r = await navigator.serviceWorker.getRegistration(); if (r) await r.update(); const c = await caches.open((await caches.keys())[0] || 'stupeni');
    await c.add('./index.html'); $('offMsg').textContent = 'Готово: копия обновлена.'; } catch(e){ $('offMsg').textContent = 'Не получилось: нужен интернет и открытие по HTTPS.'; }
  offState();
};
function offlineHtml(){
  const page = (title, body) => `<section class="sheet-pg"><h2>${title}</h2>${body}</section>`;
  const cards = EX['com-cards'] ? EX['com-cards'].groups.map(g => page('Карточки: ' + g.t, `<div class="cards">${g.cards.map(c=>`<div class="card">${pic(c)}<p>${c.say}</p></div>`).join('')}</div>`)).join('') : '';
  const stories = [{t:STORY.title, pages:STORY.pages.map(p=>({ill:p.ill, text:p.text}))}, ...Object.values(EX).filter(e=>e.e==='story').map(e=>({t:e.t, pages:e.pages}))]
    .map(s => page('История: ' + s.t, `<div class="pages">${s.pages.map((p,i)=>`<div class="pg"><div class="art">${pic(p)}</div><p><b>${i+1}.</b> ${p.text}</p></div>`).join('')}</div>`)).join('');
  const css = [...document.styleSheets].map(s => { try { return [...s.cssRules].map(r=>r.cssText).filter(t => t.startsWith(':root') || t.startsWith('@media (prefers-color-scheme')).join('\n'); } catch(e){ return ''; } }).join('\n');
  return `<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ступени: карточки и истории</title>
<style>${css}
body{margin:0;padding:16px;font:16px/1.45 -apple-system,system-ui,sans-serif;background:var(--bg);color:var(--ink)}h1{font-size:26px}h2{font-size:20px;margin:0 0 12px}
.sheet-pg{background:var(--surface);border-radius:20px;padding:18px;margin:0 0 18px;break-after:page}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px}.card{border:3px solid var(--line);border-radius:18px;padding:10px;text-align:center}
.card svg{width:100%;max-width:120px;height:auto}.card p{margin:6px 0 0;font-weight:800;font-size:18px}
.pages{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}.pg{border:2px solid var(--line);border-radius:16px;padding:10px}.art svg{width:100%;max-height:160px}
@media print{body{background:#fff;padding:0}.sheet-pg{border-radius:0}}</style></head><body>
<h1>Ступени: карточки и социальные истории</h1><p>Файл работает без интернета. Его можно распечатать или открыть на планшете.</p>${cards}${stories}</body></html>`;
}
ACT['off-file'] = async () => { const how = await giveFile('stupeni-kartochki-i-istorii.html', 'text/html', offlineHtml());
  $('offMsg').textContent = how === 'share' ? 'Выберите «Сохранить в Файлы». Файл откроется без интернета.' : how === 'download' ? 'Файл скачан. На iPhone он в приложении «Файлы», папка «Загрузки».' : ''; };

/* ---------- Кабинет родителя: вкладки ---------- */
const PARENT_TABS = [['','Обзор'],['tasks','Задания от специалиста'],['mood','Настроение'],['chat','Вопрос куратору'],['more','Настройки']];
const parentOverview = R.parent, parentOverviewAfter = AFTER.parent;
const parentHead = () => `<section class="wrap page-head"><p class="eyebrow">Кабинет родителя</p><h1>Миша, 6 лет</h1><p class="muted">Ведут: логопед Анна Сергеевна, психолог Олег Викторович</p></section>`;
R.parent = tab => {
  const bar = `<section class="wrap">${tabsBar('parent', PARENT_TABS, tab||'')}${remindBanner()}</section>`;
  if (!tab){ const html = parentOverview(); const i = html.indexOf('</section>') + 10; return html.slice(0, i) + bar + html.slice(i); }
  const body = {
    tasks: () => `<section class="wrap"><div class="panel"><h2>Задания от специалиста</h2><p class="muted small" style="margin-bottom:12px">Индивидуальный маршрут Миши. Назначает Анна Сергеевна.</p>${assignList(KID_ID, false)}</div>${DEMO_NOTE}</section>`,
    mood: () => `<section class="wrap two">${moodPicker(KID_ID)}<div class="panel"><h2>Настроение за 2 недели</h2>${moodChart(KID_ID)}</div></section>`,
    chat: () => `<section class="wrap">${chatPanel(KID_ID, 'parent')}${DEMO_NOTE}</section>`,
    more: () => `<section class="wrap two">${remindPanel()}<div class="panel"><h2>Спокойный экран</h2><p class="muted small" style="margin-bottom:14px">Без анимаций, с приглушёнными цветами и тихими звуками. Помогает при сенсорной перегрузке. Включается и в детском режиме.</p>${calmBtn()}</div></section>
      <section class="wrap two">${offlinePanel()}<div class="panel"><h2>Для дома</h2><div class="row"><a class="chip" href="#planner">Собрать расписание</a><a class="chip" href="#lists">Чек-листы</a><a class="chip" href="#calm">Подышать вместе</a><a class="chip" href="#avatar">Герой ребёнка</a></div></div></section>`
  }[tab];
  return parentHead() + bar + (body ? body() : '');
};
AFTER.parent = tab => { if (!tab) return parentOverviewAfter(); if (tab==='chat') bindChat(); if (tab==='more') offState(); };

/* ---------- Кабинет специалиста: вкладки ---------- */
const SPEC_TABS = [['','Обзор'],['iom','ИОМ'],['mood','Настроение'],['chat','Вопросы'],['notes','Заметки']];
const kidOverview = kidPage, specList = R.specialist;
R.specialist = arg => {
  const [id, tab=''] = (arg||'').split('-');
  if (!id || !KIDS[id]) return specList();
  const k = KIDS[id], bar = `<section class="wrap">${tabsBar('specialist-'+id, SPEC_TABS, tab)}</section>`;
  const head = `<section class="wrap page-head"><a class="crumbs" href="#specialist">← Мои дети</a><h1>${k.name}, ${k.age} лет</h1><p class="muted">${k.team}</p></section>`;
  if (!tab){ let html = kidOverview(id).replace(/<form class="form" id="assignForm"[\s\S]*?<\/form>/, `<a class="btn" href="#specialist-${id}-iom" style="margin-top:14px">Открыть конструктор ИОМ</a>`);
    html = html.replace(/<ul class="list assign">[\s\S]*?<\/ul>/, assignList(id, true)); const i = html.indexOf('</section>') + 10; return html.slice(0, i) + bar + html.slice(i); }
  const body = {
    iom: () => `<section class="wrap two">${iomBuilder(id)}<div class="panel"><h2>Сейчас назначено</h2>${assignList(id, true)}</div></section>`,
    mood: () => `<section class="wrap"><div class="panel"><h2>Эмоциональный фон: ${k.name}</h2><p class="muted small" style="margin-bottom:8px">Отмечает родитель утром и вечером. Шкала от 1 (раздражён) до 5 (радостный).</p>${moodChart(id)}</div></section>`,
    chat: () => `<section class="wrap">${chatPanel(id, 'spec')}</section>`,
    notes: () => `<section class="wrap">${notesPanel(id)}</section>`
  }[tab];
  return head + bar + (body ? body() : '');
};
AFTER.specialist = arg => { const [id, tab] = (arg||'').split('-'); if (tab==='chat') bindChat(); if (tab==='notes') bindNotes(); };

/* ---------- Детский режим: герой, звёзды, задания специалиста, спокойный экран ---------- */
const childBase = R.child;
R.child = () => {
  let html = childBase();
  html = html.replace(/<div class="avatar">[\s\S]*?<\/div>/, `<a class="avatar hero-av" href="#avatar" aria-label="Мой герой">${avatarSvg()}</a>`);
  html = html.replace('<button class="hold"', `<div class="child-tools"><a class="starbank" href="#avatar">★ ${S.stars}</a>${calmBtn(false)}</div><button class="hold"`);
  const extra = iom(KID_ID).filter(a => !TASKS.some(t => t.id === a.r)).slice(0, 4), tints = ['peach','sky','sage','lavender'];
  if (extra.length) html = html.replace(/(<section class="wrap tasks stagger">)/, `$1${extra.map((a,i)=>{ const d = S.done.includes(a.r) || S.done.includes(a.r.replace(/^ex-/,''));
    return `<a class="task${d?' is-done':''}" href="#${a.r}" style="--tint:var(--${tints[i%4]})"><div class="task-art">${svg(I.medal)}</div><div><h3>${a.t}</h3><p>Задание от специалиста</p></div>${d?'<span class="check">✓ Готово</span>':''}</a>`; }).join('')}`);
  return html;
};

/* ===================== роутер ===================== */
['child','schedule','story','emotions','empathy','calm','schulte','proof','maze','seek','words','picto','memo','odd','analogy','matrix','sequence','cipher'].forEach(r => CHILD.add(r));
const view = document.getElementById('view');
let current = {route:'home', arg:''};
function render(keepScroll){
  applyCalm();
  if (G && G.timer) clearTimeout(G.timer);
  if (window.speechSynthesis) speechSynthesis.cancel();
  const raw = (location.hash||'').slice(1) || 'home';
  const i = raw.indexOf('-'), r = i<0?raw:raw.slice(0,i), arg = i<0?'':raw.slice(i+1);
  const route = R[r] ? r : 'home';
  current = {route, arg, raw};
  document.documentElement.dataset.mode = CHILD.has(route) ? 'child' : 'adult';
  const y = window.scrollY;
  view.innerHTML = R[route](arg);
  if (keepScroll === true) window.scrollTo(0, y);
  else { view.classList.remove('enter'); void view.offsetWidth; view.classList.add('enter'); window.scrollTo(0,0); }
  AFTER[route] && AFTER[route](arg);
  document.querySelectorAll('.fav[data-cur]').forEach(b => { const on = (S.fav||[]).includes(raw); b.setAttribute('aria-pressed', on); b.textContent = on ? '★' : '☆'; });
  const navKey = CHILD.has(route) ? 'child' : route;
  document.querySelectorAll('.nav a').forEach(a => a.getAttribute('href')==='#'+navKey ? a.setAttribute('aria-current','page') : a.removeAttribute('aria-current'));
}
let navDepth = 0;
window.addEventListener('hashchange', () => { navDepth++; render(); });
ACT.back = () => { if (navDepth > 0){ navDepth -= 2; history.back(); } else location.hash = 'child'; };
ACT.again = () => { if (G && G.timer) clearTimeout(G.timer); AFTER[current.route] && AFTER[current.route](current.arg); };
ACT.rate = el => { S.rates[el.dataset.r] = +el.dataset.v; save(); el.parentNode.querySelectorAll('button').forEach(b => b.setAttribute('aria-pressed', b===el)); };
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el || el.disabled) return;
  const fn = ACT[el.dataset.act]; if (fn){ e.preventDefault(); fn(el); }
});
render();
</script>

<script>
if ('serviceWorker' in navigator && window.isSecureContext) navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
